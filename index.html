<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MENSURATOR</title>
    <!-- Opened from the Home Screen, the game runs without any browser bars -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mensurator">
    <meta name="theme-color" content="#efe6d3">
    <link rel="apple-touch-icon" href="mensurator-icon.png">
    <link rel="manifest" href="mensurator.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Noto+Music&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=IM+Fell+Double+Pica&family=Grenze+Gotisch:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --bg: #fbf7ef;
            --paper: #fffdf8;
            --band: #f1e8d8;
            --ink: #3b3125;
            --soft: #8a7b66;
            --line: #e0d4c0;
            --mark: #9c6b3c;
            --red: #b5473a;
            --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color-scheme: light;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            font-family: var(--sans);
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #gameWrapper {
            position: relative;
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 12px;
        }

        #canvasContainer {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 2 / 1;
            max-width: calc((100vh - 24px) * 2);
            max-width: calc((100dvh - 24px) * 2);
        }

        canvas {
            width: 100%;
            height: 100%;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 1px 2px rgba(59, 49, 37, 0.05), 0 10px 30px rgba(59, 49, 37, 0.07);
            transition: filter 0.15s;
            display: block;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .bullet-time { filter: grayscale(0.85) contrast(1.05); }
        .alla-breve { filter: saturate(1.6) hue-rotate(-12deg); }

        /* Paper-and-ink layer for the print themes; the game canvas underneath still takes the clicks */
        #fxCanvas {
            display: none; position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none; border-radius: 3px;
            box-shadow: 0 1px 2px rgba(40, 28, 16, 0.12), 0 10px 30px rgba(40, 28, 16, 0.12);
            transition: filter 0.15s;
        }
        body:not([data-theme="modern"]) canvas#gameCanvas { border-radius: 3px; border-color: transparent; box-shadow: none; }
        #canvasContainer:has(#gameCanvas.bullet-time) #fxCanvas { filter: grayscale(0.85) contrast(1.05); }
        #canvasContainer:has(#gameCanvas.alla-breve) #fxCanvas { filter: saturate(1.6) hue-rotate(-12deg); }
        #themeSelect {
            display: block; width: 100%; margin-top: 8px; padding: 9px 12px;
            font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
            background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
        }

        .html-btn {
            display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; padding: 0;
            background: rgba(255, 253, 248, 0.85);
            color: var(--ink);
            border: 1px solid var(--line);
            font-family: inherit; font-size: 16px; font-weight: 600;
            border-radius: 999px; cursor: pointer;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .html-btn:hover { border-color: var(--mark); }
        .html-btn:active { background: var(--band); }

        /* On-screen controls, shown only on touch devices */
        #pad {
            --b: min(66px, 17vh, calc((100vw - 80px) / 4.3));
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 34;
            display: none; justify-content: space-between; align-items: flex-end;
            padding: 0 max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            pointer-events: none;
        }
        #pad.show { display: flex; }
        .pad-cluster { display: flex; align-items: flex-end; gap: 12px; }
        .pad-dir { display: grid; grid-template-columns: var(--b) var(--b); gap: 12px; }
        .pad-dir .pad-btn[data-k="down"] { grid-column: 1 / span 2; justify-self: center; width: calc(var(--b) * 0.8); height: calc(var(--b) * 0.8); }
        .pad-btn {
            pointer-events: auto;
            width: var(--b); height: var(--b); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255, 253, 248, 0.42);
            border: 1.5px solid rgba(156, 107, 60, 0.5);
            color: var(--mark); font-family: inherit; font-size: calc(var(--b) * 0.36); font-weight: 700; line-height: 1;
            box-shadow: 0 4px 14px rgba(59, 49, 37, 0.08);
            user-select: none; -webkit-user-select: none;
        }
        .pad-btn.on { background: var(--mark); color: var(--paper); border-color: var(--mark); }
        .pad-btn[data-k="jump"] { width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); }
        .pad-btn[data-k="shoot"] { margin-bottom: calc(var(--b) * 0.75); }
        #pad:not(.kart) .pad-btn[data-k="down"] { display: none; }
        @media (orientation: portrait) { #pad { --b: min(78px, calc((100vw - 80px) / 4.3)); padding-bottom: max(28px, env(safe-area-inset-bottom)); } }
        @media (max-height: 500px) and (orientation: landscape) {
            .menu-box { padding: 16px 20px; }
            .menu-box h2 { margin-bottom: 10px; }
            .slider-container { margin: 8px 0; }
            .menu-box hr { margin: 10px 0; }
        }
        body.no-fs #fsPauseBtn { display: none; }

        #tPause {
            position: fixed; top: 10px; right: 10px; width: 44px; height: 44px;
            font-size: 13px; font-weight: 800; letter-spacing: 1px; border-radius: 50%;
            background: rgba(255, 253, 248, 0.85); border: 1px solid var(--line); color: var(--ink);
            display: none; justify-content: center; align-items: center; z-index: 35;
            box-shadow: 0 4px 14px rgba(59, 49, 37, 0.08);
        }


        @media (orientation: portrait) {
            body { justify-content: flex-start; }
            #gameWrapper { flex-direction: column; justify-content: flex-start; height: 100%; }
            #canvasContainer { flex-shrink: 0; margin-top: 10px; }
        }

        #titleDevBtn {
            position: fixed;
            bottom: 12px;
            left: 12px;
            z-index: 25;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--soft);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
        }
        #titleDevBtn:hover { color: var(--ink); border-color: var(--mark); }

        /* Overlays and panels */
        .overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(251, 247, 239, 0.72);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            z-index: 30; justify-content: center; align-items: center; flex-direction: column;
        }
        .menu-box {
            background: var(--paper); color: var(--ink);
            padding: 28px 32px; border: 1px solid var(--line); border-radius: 18px;
            box-shadow: 0 20px 50px rgba(59, 49, 37, 0.14);
            text-align: center; pointer-events: auto; max-width: 92%; width: 440px;
        }
        .menu-box h2 { margin: 0 0 18px; color: var(--ink); font-size: 22px; font-weight: 800; letter-spacing: 3px; }
        .menu-box p { color: var(--soft); font-size: 14px; margin: 0 0 8px; }
        .menu-box hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
        .slider-container { margin: 14px 0; font-size: 13px; font-weight: 500; color: var(--soft); text-align: left; }
        .slider-container label { display: block; }
        .slider-value { float: right; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
        .speed-name { display: block; margin-top: 4px; color: var(--ink); font-weight: 600; font-size: 14px; }
        .slider-container input[type=range] { width: 100%; margin-top: 10px; cursor: pointer; accent-color: var(--mark); }
        .menu-btn {
            background: var(--ink); color: var(--paper); border: 1px solid var(--ink);
            padding: 11px 20px; font-family: inherit; font-size: 15px; font-weight: 600;
            border-radius: 999px; cursor: pointer; margin: 6px 4px;
        }
        .menu-btn:hover { background: #2a231a; }
        .menu-btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
        .menu-btn.ghost:hover { border-color: var(--mark); }
        .menu-btn.danger { background: transparent; color: var(--red); border-color: rgba(181, 71, 58, 0.4); }
        .menu-btn.danger:hover { border-color: var(--red); }
        .menu-btn.block { display: block; width: 100%; margin: 0 0 10px; }
        .dev-section-label { color: var(--mark); font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
        .dev-stage-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
        .dev-stage-btn {
            padding: 9px 4px; font-family: inherit; font-size: 13px; font-weight: 600;
            border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
        }
        .dev-stage-btn:hover { border-color: var(--mark); }
        .dev-warp {
            display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
            margin: 12px 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
        }
        .dev-warp label { color: var(--ink); font-weight: 600; font-size: 13px; }
        .dev-warp input {
            width: 64px; padding: 6px; font-family: inherit; font-size: 15px; font-weight: 600; text-align: center;
            color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
        }
        .dev-check { color: var(--red); font-weight: 700; cursor: pointer; text-align: center; }
        .dev-check input { width: auto; margin-right: 8px; accent-color: var(--red); }

        #mobileNameInputOverlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(251, 247, 239, 0.96);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: var(--sans); color: var(--ink); text-align: center; padding: 16px;
        }
        #mobileNameInputOverlay .t { font-size: 28px; font-weight: 800; letter-spacing: 3px; margin-bottom: 14px; }
        #mobileNameInputOverlay .s { font-size: 15px; color: var(--soft); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
        #mobileNameInputOverlay .p { font-size: 14px; font-weight: 600; color: var(--mark); margin: 16px 0 10px; }
        #mobileNameInput {
            font-family: inherit; font-size: 17px; font-weight: 600; text-align: center;
            padding: 10px 14px; width: 220px; margin-bottom: 18px;
            color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; outline: none;
        }
        #mobileNameInput:focus { border-color: var(--mark); }
        #mobileNameInputOverlay .row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="canvasContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="tPause">II</div>
    </div>
</div>

<div id="pad" aria-hidden="true">
    <div class="pad-cluster pad-dir">
        <div class="pad-btn" data-k="down">▼</div>
        <div class="pad-btn" data-k="left">◀</div>
        <div class="pad-btn" data-k="right">▶</div>
    </div>
    <div class="pad-cluster">
        <div class="pad-btn" data-k="shoot">●</div>
        <div class="pad-btn" data-k="jump">▲</div>
    </div>
</div>

<button type="button" id="titleDevBtn" aria-label="Developer mode">DEV</button>

<div id="devOverlay" class="overlay" style="z-index: 40;">
    <div class="menu-box" style="width: 480px; max-height: 92vh; overflow-y: auto;">
        <h2>Modus Formatoris</h2>
        <p>Stadium Classicum (I–VIII) vel pugna cum Diabolo.</p>
        <div class="dev-stage-grid" id="devStageGrid"></div>
        <button type="button" class="menu-btn danger block" id="devBossBtn">Pugna: MI-FA (Boss)</button>
        <div class="dev-warp">
            <label for="devEndlessLevelInput">Endless Mode Warp (0-23):</label>
            <input type="number" id="devEndlessLevelInput" min="0" max="23" value="0">
            <button type="button" class="menu-btn" id="devEndlessJumpBtn" style="margin: 0; padding: 7px 16px;">WARP</button>
        </div>
        <button type="button" class="menu-btn ghost block" id="devLeaderboardBtn">Test: Nomen in Tabella</button>
        <button type="button" class="menu-btn danger block" id="devResetLeaderboardBtn">Reset Leaderboard</button>
        <button type="button" class="menu-btn block" id="devCloseBtn">Claudere</button>
    </div>
</div>

<div id="pauseOverlay" class="overlay">
    <div class="menu-box" style="max-height: 88vh; overflow-y: auto;">
        <h2>PAUSATUM</h2>

        <button class="menu-btn block" onclick="togglePause()">Resume</button>
        <button class="menu-btn ghost block" onclick="quitToMenu()">Quit to Title</button>
        <button class="menu-btn ghost block" id="fsPauseBtn" onclick="toggleFullscreen()">Full screen</button>

        <hr>

        <div class="slider-container">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect" onchange="applyTheme(this.value)">
                <option value="petrucci">Petrucci</option>
                <option value="attaingnant">Attaingnant</option>
                <option value="rubrica">Red &amp; Black</option>
                <option value="manuscript">Manuscript</option>
            </select>
        </div>
        <div class="slider-container">
            <label>Mensura (Game Speed) <span id="speedLabel" class="speed-name">Tempus perfectum prolatio minor</span>
            <input type="range" id="speedSlider" min="0" max="4" step="1" value="2" oninput="updateSpeedLabel()"></label>
        </div>
        <div class="slider-container">
            <label>Musica Vol <span class="slider-value" id="musicVolValue">0.8</span><input type="range" id="musicVol" min="0" max="1" step="0.05" value="0.8" oninput="updateSliderValue('musicVolValue', this.value)"></label>
        </div>
        <div class="slider-container">
            <label>Effectus Vol <span class="slider-value" id="fxVolValue">0.4</span><input type="range" id="fxVol" min="0" max="1" step="0.05" value="0.4" oninput="updateSliderValue('fxVolValue', this.value)"></label>
        </div>
        <div id="devPhysicsSection" style="display: none;">
            <hr>
            <div class="dev-section-label">⚙ DEV MODE: Physics Tweaker</div>
            <div class="slider-container">
                <label>Gravitas <span class="slider-value" id="gravityValue">0.6</span><input type="range" id="gravitySlider" min="0.2" max="1.0" step="0.1" value="0.6" oninput="updateSliderValue('gravityValue', this.value)"></label>
            </div>
            <div class="slider-container">
                <label>Saltus Altitudo (Jump Height) <span class="slider-value" id="jumpPowerValue">9</span><input type="range" id="jumpPowerSlider" min="5" max="13" step="1" value="9" oninput="updateSliderValue('jumpPowerValue', this.value)"></label>
            </div>
            <div class="slider-container">
                <label>Celeritas Pedestris (Walk Speed) <span class="slider-value" id="walkSpeedValue">6.5</span><input type="range" id="walkSpeedSlider" min="3" max="10" step="0.5" value="6.5" oninput="updateSliderValue('walkSpeedValue', this.value)"></label>
            </div>
            <div class="slider-container">
                <label>Cursus Velocitas (Sprint Speed) <span class="slider-value" id="sprintSpeedValue">12</span><input type="range" id="sprintSpeedSlider" min="8" max="16" step="1" value="12" oninput="updateSliderValue('sprintSpeedValue', this.value)"></label>
            </div>
            <div class="slider-container dev-check">
                <label>
                    <input type="checkbox" id="devInvincibilityToggle">
                    INVINCIBILITY
                </label>
            </div>
        </div>
    </div>
</div>
<script>
    // --- FULL SCREEN ---
    // iPhone Safari has no Fullscreen API: inside the site page, the button opens the game on its own page instead
    const fsApi = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    const inFrame = (() => { try { return window.self !== window.top && !!window.top.location.href; } catch (e) { return false; } })();
    const standaloneApp = window.matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone === true;
    const fsAvailable = !standaloneApp && (fsApi || inFrame);
    function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function fsLabel() { return isFullscreen() ? 'Exit full screen' : 'Full screen'; }
    function toggleFullscreen() {
        if (!fsApi) { if (inFrame) window.top.location.href = location.href.split(/[?#]/)[0] + '#install'; return; }
        const elem = document.documentElement;
        if (!isFullscreen()) {
            const req = elem.requestFullscreen ? elem.requestFullscreen({ navigationUI: 'hide' }) : elem.webkitRequestFullscreen();
            // Phones play best sideways; where the browser allows it, hold landscape while in full screen
            Promise.resolve(req).then(() => { if (isTouchDevice && screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape'); }).catch(() => {});
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    }
    function syncFsLabels() { const b = document.getElementById('fsPauseBtn'); if (b) b.textContent = fsLabel(); }
    document.addEventListener('fullscreenchange', syncFsLabels);
    document.addEventListener('webkitfullscreenchange', syncFsLabels);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    // Logical game size is 800x400; the backing store is scaled for sharp rendering on high-density screens
    const W = 800, H = 400;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * DPR; canvas.height = H * DPR;
    
    const pauseOverlay = document.getElementById('pauseOverlay');
    const pad = document.getElementById('pad');
    const padBtns = [...pad.querySelectorAll('.pad-btn')];
    if (!fsAvailable) document.body.classList.add('no-fs');
    const tPause = document.getElementById('tPause');
    const canvasContainer = document.getElementById('canvasContainer');
    const titleDevBtn = document.getElementById('titleDevBtn');
    const devOverlay = document.getElementById('devOverlay');
    const devStageGrid = document.getElementById('devStageGrid');
    const devBossBtn = document.getElementById('devBossBtn');
    const devCloseBtn = document.getElementById('devCloseBtn');

    for (let i = 0; i < 8; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dev-stage-btn';
        b.textContent = 'Modus ' + (i + 1);
        b.addEventListener('click', () => devPickStage(i));
        devStageGrid.appendChild(b);
    }
    devBossBtn.addEventListener('click', () => devPickBoss());
    const devEndlessJumpBtn = document.getElementById('devEndlessJumpBtn');
    devEndlessJumpBtn.addEventListener('click', () => {
        let targetLevel = parseInt(document.getElementById('devEndlessLevelInput').value) || 0;
        if (targetLevel < 0) targetLevel = 0;
        if (targetLevel > 23) targetLevel = 23;
        
        window.endlessStartLevel = targetLevel;
        gameMode = 'ENDLESS';
        currentLevel = targetLevel;
        closeDevPanel();
        if (gameState === 'PAUSE') togglePause();
        startGame();
    });
    const devLeaderboardBtn = document.getElementById('devLeaderboardBtn');
    devLeaderboardBtn.addEventListener('click', () => devTestLeaderboard());
    const devResetLeaderboardBtn = document.getElementById('devResetLeaderboardBtn');
    devResetLeaderboardBtn.addEventListener('click', () => devResetLeaderboard());
    devCloseBtn.addEventListener('click', () => closeDevPanel());
    
    titleDevBtn.addEventListener('click', () => { 
        if (gameState === 'MENU') {
            if (devOverlay.style.display === 'flex') {
                closeDevPanel();
            } else {
                if (isDevUnlocked) {
                    openDevPanel();
                } else {
                    const pwd = prompt("Introduce tesseram (Enter Password):");
                    if (pwd === "67") {
                        isDevUnlocked = true;
                        document.getElementById('devPhysicsSection').style.display = 'block';
                        openDevPanel();
                    } else if (pwd !== null) {
                        alert("Accessus interdictus! (Access Denied)");
                    }
                }
            }
        }
    });
    function openDevPanel() { devOverlay.style.display = 'flex'; }
    function closeDevPanel() { devOverlay.style.display = 'none'; }
    function devPickStage(n) {
        gameMode = 'CLASSIC';
        currentLevel = n;
        closeDevPanel();
        startGame();
    }
    function devPickBoss() {
        gameMode = 'CLASSIC';
        currentLevel = 7;
        window.skipToBoss = true; // Tell startGame to teleport the player
        closeDevPanel();
        startGame();
    }
    function devTestLeaderboard() {
        player.score = Math.floor(Math.random() * 500) + 100;
        levelTime = Math.floor(Math.random() * 300) + 120;
        inputName = '';
        if (!currentLevelData) { currentLevelData = { hasFuga: false, goal: { x: 100 } }; }
        gameState = 'NAME_INPUT';
        closeDevPanel();
    }
    
    function devResetLeaderboard() {
        if (confirm(`Are you sure you want to reset the ${currentLeaderboardMode} leaderboard? This will delete all entries!`)) {
            leaderboard = [];
            const codes = getDreamloCodes(currentLeaderboardMode);
            const targetUrl = `http://dreamlo.com/lb/${codes.priv}/clear`;
            const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`;
            
            fetch(proxyUrl)
            .then(response => {
                if (response.ok) {
                    alert(`${currentLeaderboardMode} Leaderboard has been reset.`);
                    loadLeaderboard();
                } else { alert('Failed to reset leaderboard.'); }
            })
            .catch(error => { alert('Error resetting leaderboard.'); });
        }
    }
    
    const musicVolSlider = document.getElementById('musicVol');
    const fxVolSlider = document.getElementById('fxVol');
    const speedSlider = document.getElementById('speedSlider');
    const speedLabel = document.getElementById('speedLabel');
    const decaySlider = document.getElementById('decaySlider');
let isDevUnlocked = false;
let devInvincible = false;
    // Dev Mode Physics Sliders
    const gravitySlider = document.getElementById('gravitySlider');

    async function loadLeaderboard(mode = currentLeaderboardMode) {
        let list = null;
        try {
            const codes = getDreamloCodes(mode);
            const targetUrl = `http://dreamlo.com/lb/${codes.pub}/json`;
            const proxyUrl = `${PROXY_URL}${encodeURIComponent(targetUrl)}`;
            
            const response = await fetch(proxyUrl);

            if (response.ok) {
                const data = await response.json();
                list = [];
                if (data.dreamlo && data.dreamlo.leaderboard && data.dreamlo.leaderboard.entry) {
                    const entries = Array.isArray(data.dreamlo.leaderboard.entry) 
                        ? data.dreamlo.leaderboard.entry 
                        : [data.dreamlo.leaderboard.entry];
                    
                    entries.forEach(entry => {
                        list.push({
                            name: entry.name,
                            score: parseInt(entry.score),
                            time: entry.seconds ? parseInt(entry.seconds) : 0
                        });
                    });
                }
            }
        } catch (error) { console.log('Failed to load from Dreamlo:', error); }
        
        if (list) {
            list.sort((a, b) => b.score - a.score);
            boards[mode] = list.slice(0, BOARD_SIZE);
        }
        if (mode === currentLeaderboardMode) leaderboard = boards[mode] || [];

            walkSpeed: parseFloat(walkSpeedSlider?.value || 6.5),
            sprintSpeed: parseFloat(sprintSpeedSlider?.value || 10.5)
        };
    }

    function advanceSplash() {
        gameState = 'PLAY';
        startBGM(currentLevel);
    }

    function generateLevel(levelIndex, isEndless) {
        const platforms = [], enemies = [], flyingEnemies = [], jumpingFlats = [], fallingLongas = [];
        const items = [], scoreNotes = [], checkpoints = [], tempusItems = [], dashPads = [], inkPots = [], allaBreves = [];
        const groundChunks = [], walls = [], cfStars = []; 
        let lastPowerupX = -1000;
        
        // Enemy generation helper scoped within generateLevel to access variables
        const createEnemy = (minX, maxX, startX, basePy) => {
            const types = ['BREVIS_REST', 'SEMIBREVIS_REST', 'MINIMA_REST'];
            const type = types[Math.floor(Math.random() * types.length)];
            let spaceY = 290;
            if (gameMode !== 'GRADUS') {
                const spaces = [230, 260, 290, 320];
                spaceY = spaces[Math.floor(Math.random() * spaces.length)];
            } else {
                spaceY = basePy - 30; // Approximation for gradus platforms
            }

            let h = 60, y = spaceY, mult = 1, vIndex = 32;
            if (type === 'BREVIS_REST') {
                h = 30;
                y = gameMode === 'GRADUS' ? basePy - 30 : spaceY;
                vIndex = 16;
            } else if (type === 'SEMIBREVIS_REST') {
                h = 15;
                y = gameMode === 'GRADUS' ? basePy - 30 : spaceY;
                vIndex = 8;
            } else if (type === 'MINIMA_REST') {
                h = 15;
                y = gameMode === 'GRADUS' ? basePy - 15 : spaceY + 15;
                mult = 1.4;
                vIndex = 4;
            }
            
            let spd = (gameMode === 'GRADUS' ? 1.5 : (1.5 + (levelIndex * 0.2))) * mult;
            return { x: startX, y: y, w: 12, h: h, baseVx: spd, vx: spd, minX: minX, maxX: maxX, aggro: false, dead: false, damage: vIndex, valueIndex: vIndex, type: type };
        };

        if (gameMode === 'GRADUS') {
            const length = 50000; let py = 350; let px = 400; platforms.push({ x: -1000, y: 350, w: 3000, h: 50, type: 'ground', shakeTimer: 0, falling: false });
            for(let i = 0; i < 2000; i++) {
                py -= 40 + Math.random() * 30; px += (Math.random() > 0.5 ? 1 : -1) * (60 + Math.random() * 80); 
                if (px < 50) px = 50 + Math.random()*50; if (px > 650) px = 650 - Math.random()*50;
                let pType = 'normal'; let r = Math.random();
                if (r > 0.8) pType = 'ice'; else if (r > 0.6) pType = 'descend'; else if (r > 0.4) pType = 'rising';
                
                let pw = 73 + Math.random() * 147;
                platforms.push({ x: px, y: py, w: pw, h: 20, type: pType, shakeTimer: 0, falling: false });
                
                if (Math.random() > 0.52) scoreNotes.push({ x: px + 30, y: py - 30, w: 15, h: 15, active: true });
                if (Math.random() > 0.86) enemies.push(createEnemy(px, px + 40, px, py));
                if (Math.random() > 0.93) jumpingFlats.push({ x: px + 20, baseY: py - 20, y: py - 20, w: 20, h: 30, state: 'idle', timer: Math.random() * 60, vy: 0, dead: false, damage: 4, valueIndex: 4, type: 'FLAT' });
                
                if (py > -48000 && (px - lastPowerupX > 800 || lastPowerupX - px > 800)) {
                    if (Math.random() > 0.95) { tempusItems.push({ x: px + pw/2, y: py - 50, w: 25, h: 25, active: true }); lastPowerupX = px; }
                    else if (Math.random() > 0.95) { allaBreves.push({ x: px + pw/2, y: py - 50, w: 25, h: 25, active: true }); lastPowerupX = px; }
                }
            }
            return { length, platforms, groundChunks, dashPads, walls, fallingLongas, inkPots, allaBreves, cfStars, enemies, flyingEnemies, jumpingFlats, items, scoreNotes, tempusItems, checkpoints, hasFuga: true, goal: {x:0, y:-50000, w:800, h:40} }; 
        }

        const length = isEndless ? 250000 : 8000 + (levelIndex * 2000); 
        let cx = 0;
        let gapChance = (levelIndex === 7) ? 0 : Math.min(0.1 + (levelIndex * 0.055), 0.48);
        let enemyChance = Math.min(0.16 + (levelIndex * 0.065), 0.52);
        let hazardChance = Math.min(levelIndex * 0.11, 0.46); 
        let longaChance = Math.min(levelIndex * 0.11, 0.4);

        let heightOptions = [295, 265];
        if (levelIndex >= 2 || isEndless) heightOptions.push(235);
        if (levelIndex >= 4 || isEndless) heightOptions.push(205);
        if (levelIndex >= 6 || isEndless) heightOptions.push(175, 145);
        
        let inkPotSpawned = false;

        while (cx < length) {
            let w = Math.floor(Math.random() * 400) + 200; if (cx + w > length) w = length - cx;
            let gap = (Math.random() < gapChance && levelIndex !== 7) ? Math.floor(Math.random() * (80 + levelIndex * 15)) + 80 : 0; if (cx === 0) gap = 0; 
            groundChunks.push({ x: cx, w: w }); let hasWall = (levelIndex !== 7 && cx > 400 && Math.random() > 0.6);
            if (hasWall) {
                walls.push({ x: cx + w/2, y: 230, w: 4, h: 120 });
                if (Math.random() < enemyChance) enemies.push(createEnemy(cx + 10, cx + w/2 - 20, cx + 20, 0));
                if (Math.random() < enemyChance) enemies.push(createEnemy(cx + w/2 + 10, cx + w - 20, cx + w/2 + 20, 0));
            } else { 
                if (Math.random() < enemyChance) enemies.push(createEnemy(cx + 10, cx + w - 20, cx + w/2, 0)); 
            }
            if (Math.random() < hazardChance) jumpingFlats.push({ x: cx + w/3, baseY: 320, y: 320, w: 20, h: 30, state: 'idle', timer: Math.random() * 60 + 20, vy: 0, dead: false, damage: 4, valueIndex: 4, type: 'FLAT' }); cx += w + gap;
        }

        const platStride = 328 + Math.min(levelIndex * 24, 160);
        for(let i=400; i<length-400; i+= platStride) {
            let py = heightOptions[Math.floor(Math.random() * heightOptions.length)]; 
            let pw = 73 + Math.random() * 147; 
            let pType = 'normal'; let r = Math.random(); 
            if (r > 0.8) pType = 'ice'; else if (r > 0.6) pType = 'descend'; else if (r > 0.4) pType = 'rising';
            
            platforms.push({ x: i, y: py, w: pw, h: 20, type: pType, shakeTimer: 0, falling: false });
            
            if (i - lastPowerupX > 800) {
                if (Math.random() > 0.95) { tempusItems.push({ x: i + pw/2, y: py - 50, w: 25, h: 25, active: true }); lastPowerupX = i; }
                else if (Math.random() > 0.95) { allaBreves.push({ x: i + pw/2, y: py - 50, w: 25, h: 25, active: true }); lastPowerupX = i; }
                else if (!inkPotSpawned && Math.random() > 0.90) { inkPots.push({ x: i + pw/2, y: py - 50, w: 20, h: 25, active: true }); inkPotSpawned = true; lastPowerupX = i; }
            }
            
            const aerialTone = 1 - Math.min(levelIndex * 0.05, 0.28);
            if (Math.random() < hazardChance * aerialTone) { let flyY = Math.max(py - 80, 50); flyingEnemies.push({ x: i + 150, y: flyY, w: 20, h: 40, baseY: flyY, time: Math.random()*100, dead: false, damage: 4, valueIndex: 4, type: 'SHARP' }); }
            if (Math.random() < longaChance * aerialTone) fallingLongas.push({ x: i + 200, baseY: 80, y: 80, w: 22, h: 60, vy: 0, state: 'idle', shakeTimer: 0, dead: false, damage: 16, valueIndex: 16, type: 'LONGA_REST' });
        }

        let scoreX = 400;
        while (scoreX < length - 200) { scoreNotes.push({ x: scoreX, y: 150 + Math.sin(scoreX/150)*40, w: 15, h: 15, active: true }); scoreX += 275 + Math.min(levelIndex * 22, 120) + Math.random() * 100; }

        if (!isEndless) {
            checkpoints.push({ x: length * 0.33, w: 20, h: 150, active: true, label: "Clausula Media" }); checkpoints.push({ x: length * 0.66, w: 20, h: 150, active: true, label: "Clausula Tenoris" });
            if (levelIndex === 7) checkpoints.push({ x: length - 1200, w: 20, h: 150, active: true, label: "Porta Diaboli" });
        }
        return { length: length, platforms: platforms, groundChunks: groundChunks, dashPads: dashPads, walls: walls, fallingLongas: fallingLongas, inkPots: inkPots, allaBreves: allaBreves, cfStars: cfStars, enemies: enemies, flyingEnemies: flyingEnemies, jumpingFlats: jumpingFlats, items: items, scoreNotes: scoreNotes, tempusItems: tempusItems, checkpoints: checkpoints, goal: { x: length - 200, y: 0, w: 40, h: 400 }, hasFuga: !isEndless && (levelIndex === 3 || levelIndex === 5 || levelIndex === 7) };
    }

    // --- Inputs & Unified Menu Handling ---
    function pressRight() { keys.right = true; let now = Date.now(); if (now - lastRightTap < 250) rightTapCount++; else rightTapCount = 1; lastRightTap = now; if (rightTapCount >= 3) player.isTripleSprinting = true; else if (rightTapCount >= 2) player.isSprinting = true; }
    function releaseRight() { keys.right = false; player.isSprinting = false; player.isTripleSprinting = false; }
    function pressLeft() { keys.left = true; let now = Date.now(); if (now - lastLeftTap < 250) leftTapCount++; else leftTapCount = 1; lastLeftTap = now; if (leftTapCount >= 3) player.isTripleSprinting = true; else if (leftTapCount >= 2) player.isSprinting = true; }
    function releaseLeft() { keys.left = false; player.isSprinting = false; player.isTripleSprinting = false; }
    function pressJump() { keys.up = true; if (gameMode === 'KART') return; if (gameState === 'PLAY') { let sm = speedSettings[difficultyIndex].mult; let maxJumps = (player.stateIndex >= 11) ? 3 : 2; if (player.jumps < maxJumps) { player.vy = player.jumpPower * sm; spawnDust(player.x, player.y); player.grounded = false; player.jumps++; playSound('jump'); } } }
    function releaseJump() { keys.up = false; }
    function pressShoot() { keys.space = true; if (gameMode === 'KART') { if (gameState === 'PLAY' && kart) kartUseItem(kart.p); return; } if (gameState === 'PLAY') { projectiles.push({x: player.x + 12, y: player.y + 25, vx: keys.left ? -25 : 25, active: true}); playSound('shoot'); } }
    function releaseShoot() { keys.space = false; }
    
    function togglePause() {
        if (gameState !== 'PLAY' && gameState !== 'PAUSE') return;
        releaseAllKeys();
        if (gameState === 'PAUSE') {
            gameState = previousState;
            pauseOverlay.style.display = 'none';
            if (gameState === 'PLAY' && audioCtx) audioCtx.resume();
        } else {
            previousState = gameState;
            gameState = 'PAUSE';
            pauseOverlay.style.display = 'flex';
            if (audioCtx) audioCtx.suspend();
        }
        syncTouchGameChrome();
    }
    
    function quitToMenu() { 
        gameState = 'MENU'; previousState = 'MENU';
        pauseOverlay.style.display = 'none'; 
        if (musicTimeout) clearTimeout(musicTimeout); 
        closeDevPanel();
        syncTouchGameChrome();
        cleanupMobileOverlay();
    }

    function cleanupMobileOverlay() {
        if (window.virtualKeyboardShown && document.getElementById('mobileNameInputOverlay')) {
            document.body.removeChild(document.getElementById('mobileNameInputOverlay'));
            window.virtualKeyboardShown = false;
        }
    }

    function releaseAllKeys() {
        if (keys.left) releaseLeft();
        if (keys.right) releaseRight();
        if (keys.up) releaseJump();
        if (keys.space) releaseShoot();
        keys.down = false;
        padBtns.forEach(b => b.classList.remove('on'));
        padFingers.clear();
    }

    // Show the on-screen pad while playing (and on the level card before it, so the layout doesn't jump)
    function syncTouchGameChrome() {
        const playLike = isTouchDevice && (gameState === 'PLAY' || gameState === 'SPLASH');
        if (pad.classList.contains('show') !== playLike) pad.classList.toggle('show', playLike);
        pad.classList.toggle('kart', gameMode === 'KART');
        const pauseShown = isTouchDevice && gameState === 'PLAY';
        tPause.style.display = pauseShown ? 'flex' : 'none';
        if (playLike) updateMobileControlLayout();
    }

    window.addEventListener('keydown', (e) => {
        // A keyboard on a tablet: hide the on-screen pad until the screen is touched again
        if (isTouchDevice && !e.repeat && gameState === 'PLAY' && !e.target.closest?.('input')) { isTouchDevice = false; releaseAllKeys(); syncTouchGameChrome(); }
        if (e.code === 'Escape') {
            if (devOverlay.style.display === 'flex') { closeDevPanel(); return; }
            if (gameState === 'DEATH_FREEZE' || gameState === 'WIN') {
                if (!e.repeat) { if (gameState === 'WIN') gameState = 'MENU'; else startGame(); }
                return;
            }
            togglePause();
            return;
        }

        if (gameState === 'DEATH_FREEZE') {
            if (!e.repeat) {
                if (gameMode === 'ENDLESS') {
                    endRun();
                } else {
                    startGame();
                }
            }
            return;
        }

        if ((gameState === 'WIN') && !e.repeat) {
            if (gameState === 'WIN') gameState = 'MENU'; 
            return;
        }

        if (gameState === 'RESULT') {
            if (!e.repeat && Date.now() - resultAt > 600) showBoardAfterRun();
            return;
        }

        if (gameState === 'NAME_INPUT') {
            if (e.key === 'Enter' && inputName.length > 0) {
                addToLeaderboard(inputName, player.score, levelTime);
                showBoardAfterRun();
                cleanupMobileOverlay();
            } else if (e.key === 'Escape') {
                showBoardAfterRun();
                cleanupMobileOverlay();
            } else if (e.key === 'Backspace') {
                inputName = inputName.slice(0, -1);
            } else if (e.key.length === 1 && inputName.length < 15) {
                inputName += e.key;
            }
            return;
        }

        if (gameState === 'LEADERBOARD') {
            if (e.key === 'Escape') {
                gameState = 'MENU';
            }
            return;
        }

        if (gameState === 'INSTALL_PROMPT') {
            gameState = 'MENU';
            return;
        }

        if (gameState === 'SPLASH' && !e.repeat) {
            advanceSplash();
            return;
        }

        if (gameState === 'MENU') {
            if (e.code === 'KeyM') { isMuted = !isMuted; if (isMuted && musicTimeout) clearTimeout(musicTimeout); return; }
            if (e.code === 'KeyL') { gameState = 'LEADERBOARD'; loadLeaderboard(); return; }
            if (e.code === 'KeyT') { cycleTheme(); return; }
            if (e.code === 'KeyF' && fsAvailable) { toggleFullscreen(); return; }
            if (!e.repeat) {
                if (e.key === '1') { gameMode = 'CLASSIC'; currentLevel = 0; startGame(); }
                else if (e.key === '2') { gameMode = 'ENDLESS'; currentLevel = 0; startGame(); }
                else if (e.key === '3') { gameMode = 'GRADUS'; currentLevel = 0; startGame(); }
                else if (e.key === '4') { gameMode = 'KART'; currentLevel = 0; startGame(); }
            }
            return;
        }

        if (gameState !== 'PLAY' && gameState !== 'PAUSE') return;

        if (!e.repeat) {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') pressRight();
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') pressLeft();
            if (e.code === 'ArrowUp' || e.code === 'KeyW') pressJump();
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'Space') pressShoot();
        }
        if (e.code === 'KeyM') { isMuted = !isMuted; if (isMuted && musicTimeout) clearTimeout(musicTimeout); if (!isMuted && gameState === 'PLAY') startBGM(currentLevel); }
    });
    window.addEventListener('keyup', (e) => { if (e.code === 'ArrowRight' || e.code === 'KeyD') releaseRight(); if (e.code === 'ArrowLeft' || e.code === 'KeyA') releaseLeft(); if (e.code === 'ArrowUp' || e.code === 'KeyW') releaseJump(); if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false; if (e.code === 'Space') releaseShoot(); });

    // --- ON-SCREEN TOUCH CONTROLS ---
    let mobileLayoutKey = '';

    function updateMobileControlLayout() {
        if (!isTouchDevice) return;
        const rect = canvasContainer.getBoundingClientRect();
        const landscape = window.innerWidth > window.innerHeight;
        const key = `${window.innerWidth}x${window.innerHeight}:${Math.round(rect.bottom)}`;
        if (key === mobileLayoutKey) return;
        mobileLayoutKey = key;
        tPause.style.right = '10px';
        tPause.style.top = landscape ? '10px' : `${Math.round(rect.bottom) + 10}px`;
    }

    window.addEventListener('touchstart', () => {
        if (!isTouchDevice) {
            isTouchDevice = true;
            syncTouchGameChrome();
        }
        unlockAudio();
    }, { capture: true });
    window.addEventListener('resize', () => { mobileLayoutKey = ''; updateMobileControlLayout(); });
    window.addEventListener('blur', releaseAllKeys);
    document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAllKeys(); if (gameState === 'PLAY') togglePause(); } });
    
    // --- Mobile Name Input Overlay ---
    function showMobileNameInput() {
        // If overlay is already open, just focus on text box and do NOTHING else!
        const existingOverlay = document.getElementById('mobileNameInputOverlay');
        if (existingOverlay) {
            document.getElementById('mobileNameInput').focus();
            return; 
        }
        
        window.virtualKeyboardShown = true;
        const inputOverlay = document.createElement('div');
        inputOverlay.id = 'mobileNameInputOverlay';
        inputOverlay.innerHTML = `
            <div class="t">VICTORIA!</div>
            <div class="s">Tempus: ${Math.floor(levelTime / 60)}:${Math.floor(levelTime % 60).toString().padStart(2, '0')}</div>
            <div class="s">Puncta: ${player.score}</div>
            <div class="p">Inscribe nomen tuum:</div>
            <input type="text" id="mobileNameInput" placeholder="Enter name" maxlength="15" value="${inputName}">
            <div class="row">
                <button id="mobileSaveBtn" class="menu-btn" style="margin:0;">SAVE</button>
                <button id="mobileSkipBtn" class="menu-btn ghost" style="margin:0;">SKIP</button>
            </div>
        `;
        
        document.body.appendChild(inputOverlay);
        
        const mobileInput = document.getElementById('mobileNameInput');
        const saveBtn = document.getElementById('mobileSaveBtn');
        const skipBtn = document.getElementById('mobileSkipBtn');
        
        mobileInput.focus();
        mobileInput.addEventListener('input', (e) => {
            inputName = e.target.value;
        });
        
        saveBtn.addEventListener('click', () => {
            if (inputName.length > 0) {
                addToLeaderboard(inputName, player.score, levelTime);
                showBoardAfterRun();

        });
        
        skipBtn.addEventListener('click', () => {
            showBoardAfterRun();

        });
        
        mobileInput.addEventListener('keydown', (e) => {

    }
    
    function cleanupMobileOverlay() {
        const existingOverlay = document.getElementById('mobileNameInputOverlay');
        if (existingOverlay) {
            document.body.removeChild(existingOverlay);
        }
        window.virtualKeyboardShown = false;
    }

    function handleTouchZones(e) {
        if (gameState === 'NAME_INPUT') {
            // If player is tapping on the HTML overlay (input box or buttons), let browser handle it!
            if (e.target.closest('#mobileNameInputOverlay')) {
                return; 
            }
            e.preventDefault();
            showMobileNameInput();
            return;
        }
        
        if (gameState === 'LEADERBOARD') {
            e.preventDefault();
            // Check if close button was touched
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0] || e.changedTouches[0];
            const x = (touch.clientX - rect.left) / (rect.width / W);
            const y = (touch.clientY - rect.top) / (rect.height / H);
            
            const closeBtnSize = 30;
            const closeBtnX = W - closeBtnSize - 10;
            const closeBtnY = 10;
            
            if (x >= closeBtnX && x <= closeBtnX + closeBtnSize && 
                y >= closeBtnY && y <= closeBtnY + closeBtnSize) {
                gameState = 'MENU';
            }
            return;
        }
        
        for (const id of [...padFingers.keys()]) if (![...e.touches].some(t => t.identifier === id)) padFingers.delete(id);
        if (gameState !== 'PLAY') return;
        if (e.target.closest && e.target.closest('#tPause')) return;
        e.preventDefault();

        // A finger that lands on (or near) a button keeps its side of the pad until it lifts:
        // the left thumb always steers with whichever of ◀ ▶ (▼) is nearest, the right thumb always jumps or shoots,
        // so a thumb that drifts off the button while playing is never dropped
        const rects = padBtns.filter(b => b.offsetParent !== null).map(b => { const r = b.getBoundingClientRect(); return { k: b.dataset.k, r, cx: (r.left + r.right) / 2, cy: (r.top + r.bottom) / 2 }; });
        const nearest = (t, list, slop) => {
            let best = null, bestD = Infinity;
            for (const b of list) {
                if (slop != null && (t.clientX < b.r.left - slop || t.clientX > b.r.right + slop || t.clientY < b.r.top - slop || t.clientY > b.r.bottom + slop)) continue;
                const d = Math.hypot(t.clientX - b.cx, t.clientY - b.cy);
                if (d < bestD) { bestD = d; best = b.k; }
            }
            return best;
        };
        const held = new Set();
        for (const t of e.touches) {
            let side = padFingers.get(t.identifier);
            if (!side) {
                const k = nearest(t, rects, 24);
                side = k ? (PAD_DIR.includes(k) ? 'dir' : 'act') : null;
                if (side) padFingers.set(t.identifier, side);
            }
            if (!side) continue;
            const k = nearest(t, rects.filter(b => (side === 'dir') === PAD_DIR.includes(b.k)));
            if (k) held.add(k);
        }
        setPadKey('left', held.has('left'), pressLeft, releaseLeft, keys.left);
        setPadKey('right', held.has('right'), pressRight, releaseRight, keys.right);
        setPadKey('jump', held.has('jump'), pressJump, releaseJump, keys.up);
        setPadKey('shoot', held.has('shoot'), pressShoot, releaseShoot, keys.space);
        setPadKey('down', held.has('down'), () => { keys.down = true; }, () => { keys.down = false; }, keys.down);
    }

    const PAD_DIR = ['left', 'right', 'down'];
    const padFingers = new Map(); // touch id -> 'dir' or 'act'

    function setPadKey(k, now, press, release, was) {
        if (now && !was) press();
        else if (!now && was) release();
        const b = padBtns.find(b => b.dataset.k === k);
        if (b.classList.contains('on') !== now) b.classList.toggle('on', now);
    }

    window.addEventListener('touchstart', handleTouchZones, {passive: false});
    window.addEventListener('touchmove', handleTouchZones, {passive: false});
    window.addEventListener('touchend', handleTouchZones, {passive: false});
    window.addEventListener('touchcancel', handleTouchZones, {passive: false});
    
    // Taps that move the game on: only a finger put down after the moment (not one still held from play) counts
    let tapArmed = false;
    window.addEventListener('touchstart', (e) => {
        tapArmed = gameState === 'DEATH_FREEZE' || gameState === 'WIN' || gameState === 'RESULT';
        if (gameState === 'SPLASH' && e.target !== canvas && !e.target.closest('.overlay')) advanceSplash();
    }, { passive: true });
    window.addEventListener('touchend', (e) => {
        if (!tapArmed || e.touches.length) return;
        tapArmed = false;
        if (gameState === 'WIN') { e.preventDefault(); gameState = 'MENU'; }
        else if (gameState === 'RESULT') { e.preventDefault(); if (Date.now() - resultAt > 600) showBoardAfterRun(); }
        else if (gameState === 'DEATH_FREEZE') {
            e.preventDefault();
            if (gameMode === 'ENDLESS') {
                endRun();
            } else {
                startGame();
            }
        }
    }, { passive: false });

                const hitboxY = flat.y + 15 - hitboxSize/2;
                const hitboxRect = {x: hitboxX, y: hitboxY, w: hitboxSize, h: hitboxSize};
                
                let isStomp = player.vy > 0 && checkCollision(player, hitboxRect);
                
                if (isStomp) { 
                    player.vy = -11 * buff * speedMult; 
                    if (gameMode !== 'GRADUS') player.vx = 15 * buff * speedMult; 
                    player.bounceTimer = 15; 
                    player.jumps = 1; 
                    
                    player.stateValue += flat.valueIndex || 4;
                    player.stateValue = Math.min(player.stateValue, 64);
                    player.score += 10;
                    
                    playSound('bounce'); spawnDust(player.x, player.y + player.height); 
                    flat.dead = true; 
                } 
                else if (player.colorationTimer > 0) { flat.dead = true; playSound('smash'); spawnDust(flat.x, flat.y); } 
                else if (player.invulnerableTimer <= 0) { takeDamage(0, flat, true); } 
            }
        });
        currentLevelData.flyingEnemies.forEach(enemy => { if (enemy.dead) return; enemy.time += (0.05 * timeMod); enemy.y = enemy.baseY + Math.sin(enemy.time) * 50; 
            if (checkCollision(player, enemy)) {
                let isStomp = player.vy > 0 && player.y + player.height - player.vy <= enemy.y + 20;
                if (isStomp) {
                    player.vy = -11 * buff * speedMult;
                    if (gameMode !== 'GRADUS') player.vx = 15 * buff * speedMult;
                    player.bounceTimer = 15;
                    player.jumps = 1;
                    
                    player.stateValue += enemy.valueIndex || 4;
                    player.stateValue = Math.min(player.stateValue, 64);
                    player.score += 10;
                    
                    playSound('bounce'); spawnDust(player.x, player.y + player.height);
                    enemy.dead = true;
                } else if (player.colorationTimer > 0) {
                    enemy.dead = true; playSound('smash'); spawnDust(enemy.x, enemy.y);
                } else if (player.invulnerableTimer <= 0) {
                    takeDamage(0, enemy, true);
                }
            }
        });

        currentLevelData.items.forEach(item => { 
            if (item.active && checkCollision(player, item)) { 
                item.active = false; 
                if (player.stateValue < 64) { 
                    player.stateValue = Math.min(player.stateValue * 1.5, 64); 
                } 
                playSound('point'); 
            } 
        });
        currentLevelData.scoreNotes.forEach(note => { 
            if (note.active && checkCollision(player, note)) { 
                note.active = false; player.score += 1; 
                if (player.stateValue < 64) { 
                    player.stateValue = Math.min(player.stateValue * 1.5, 64); 
                } 
                playSound('point'); 
                if (player.vx > 0) player.vx += 7.8 * speedMult; else if (player.vx < 0) player.vx -= 7.8 * speedMult; 
                player.vy = -9 * buff * speedMult; player.grounded = false; 
                player.jumps = 1; 
            } 
        });
        currentLevelData.tempusItems.forEach(item => { if (item.active && checkCollision(player, item)) { item.active = false; player.tempusTimer = 360; playSound('tempus'); updateFlashingEffects(); } });
        currentLevelData.allaBreves.forEach(item => { if (item.active && checkCollision(player, item)) { item.active = false; player.allaBreveTimer = 480; playSound('allaBreve'); updateFlashingEffects(); } });
        currentLevelData.inkPots.forEach(pot => { if (pot.active && checkCollision(player, pot)) { pot.active = false; player.colorationTimer = 360; playSound('point'); updateFlashingEffects(); } });

        if (gameMode === 'CLASSIC') {
            currentLevelData.checkpoints.forEach(cp => { if (cp.active && player.x + player.width >= cp.x && player.x <= cp.x + cp.w) { cp.active = false; respawnPoint = { x: cp.x + 20, y: 150 }; playSound('point'); } });
            if (player.x >= currentLevelData.goal.x && !boss.active) { 
                if (currentLevel + 1 < 8) { 
                    currentLevel++; respawnPoint = { x: 50, y: 150 }; 
                    currentLevelData = generateLevel(currentLevel, false); 
                    resetPlayer(respawnPoint.x, respawnPoint.y); 
                    if (musicTimeout) clearTimeout(musicTimeout);
                    gameState = 'SPLASH'; 
                } else { 
                    endRun();
                } 
            }
        } else if (gameMode === 'ENDLESS' || gameMode === 'GRADUS') {
            if (endlessDistance > 0 && endlessDistance % 50 === 0 && endlessDistance !== currentLevel * 50) { currentLevel = (currentLevel + 1) % modesData.length; startBGM(currentLevel); if (gameMode === 'ENDLESS') { currentLevelData.hasFuga = (currentLevel === 3 || currentLevel === 5 || currentLevel === 7); } }
        }
    }

    function drawDiamond(ctx, x, y, size, filled) { ctx.beginPath(); ctx.moveTo(x, y - size); ctx.lineTo(x + size, y); ctx.lineTo(x, y + size); ctx.lineTo(x - size, y); ctx.closePath(); if (filled) ctx.fill(); else { ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke(); ctx.lineJoin = 'miter'; } }

    function drawMensuralNote(ctx, x, y, stateName, isInvulnerable, opacity = 1, isColored = false, isGhost = false) {
        ctx.save(); const cx = x + 12; const cy = y + 35; let isDotted = stateName.startsWith('DOTTED_'); let baseState = stateName.replace('DOTTED_', '');
        const inkA = rgba(C.ink, opacity);
        if (isGhost) { ctx.fillStyle = rgba(C.red, 0.55); ctx.strokeStyle = rgba(C.red, 0.55); }
        else if (isColored) { if (player.colorationTimer < 60 && Math.floor(Date.now() / 100) % 2 === 0) { ctx.fillStyle = inkA; ctx.strokeStyle = inkA; } else { if (!T.print) { ctx.shadowBlur = 14; ctx.shadowColor = rgba(C.mark, 0.85); } ctx.fillStyle = T.print ? C.ink : '#1f1a14'; ctx.strokeStyle = ctx.fillStyle; } }
        else { ctx.fillStyle = inkA; ctx.strokeStyle = inkA; }
        const solid = isColored || isGhost;
        if (T.white) {
            // white mensural notation by hand: void heads drawn with a broad pen, blackened when coloured
            const head = (rx, ry) => solid ? lozenge(ctx, cx, cy, rx, ry, true) : voidLozenge(ctx, cx, cy, rx, ry, 4.6);
            const stem = (len) => nib(ctx, wob(cx, cy - 11, cx + 0.4, cy - 11 - len, 0.4, 8), 3.2);
            const box = (w, h) => solid ? ctx.fillRect(cx - w / 2, cy - h / 2, w, h) : voidRect(ctx, cx - w / 2, cy - h / 2, w, h, 5);
            switch (baseState) {
                case 'FUSA': lozenge(ctx, cx, cy, 10, 12, true); stem(34); nib(ctx, [[cx, cy - 45], [cx + 8, cy - 36], [cx + 16, cy - 24]], 3); break;
                case 'SEMIMINIMA': lozenge(ctx, cx, cy, 10, 12, true); stem(24); break;
                case 'MINIMA': head(10, 12); stem(24); break;
                case 'SEMIBREVIS': head(12, 14); break;
                case 'BREVIS': box(22, 22); break;
                case 'LONGA': box(22, 22); nib(ctx, wob(cx + 10, cy + 10, cx + 10, cy + 30, 0.4), 3.2); break;
                case 'MAXIMA': box(36, 24); nib(ctx, wob(cx + 17, cy + 12, cx + 17, cy + 35, 0.4), 3.2); break;
            }
            if (isDotted) { ctx.beginPath(); ctx.arc(cx + 21, cy - 5, 3, 0, Math.PI * 2); ctx.fill(); }
            ctx.restore();
            return;
        }
        const hollow = C.paper;
        const r = T.print ? 0 : 3;
        switch(baseState) {
            case 'FUSA': drawDiamond(ctx, cx, cy, 10, true); ctx.fillRect(cx - 1.25, cy - 45, 2.5, 35); ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy - 45); ctx.quadraticCurveTo(cx + 12, cy - 20, cx + 18, cy - 20); ctx.stroke(); break;
            case 'SEMIMINIMA': drawDiamond(ctx, cx, cy, 10, true); ctx.fillRect(cx - 1.25, cy - 35, 2.5, 25); break;
            case 'MINIMA': drawDiamond(ctx, cx, cy, 10, solid); ctx.fillRect(cx - 1.25, cy - 35, 2.5, 25); break;
            case 'SEMIBREVIS': drawDiamond(ctx, cx, cy, 13, solid); break;
            case 'BREVIS': ctx.lineWidth = 2.5; if (solid) { pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, r); ctx.fill(); } else { pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, r); ctx.stroke(); } break;
            case 'LONGA': ctx.lineWidth = 2.5; if (solid) { pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, r); ctx.fill(); } else { const f = ctx.fillStyle; ctx.fillStyle = hollow; pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, r); ctx.fill(); ctx.fillStyle = f; ctx.stroke(); } ctx.fillRect(cx + 9, cy, 2.5, 30); break;
            case 'MAXIMA': ctx.lineWidth = 2.5; if (solid) { pathRoundRect(ctx, cx - 18, cy - 12, 36, 24, r); ctx.fill(); } else { const f = ctx.fillStyle; ctx.fillStyle = hollow; pathRoundRect(ctx, cx - 18, cy - 12, 36, 24, r); ctx.fill(); ctx.fillStyle = f; ctx.stroke(); } ctx.fillRect(cx + 16, cy, 2.5, 35); break;
        }
        if (isDotted) { ctx.beginPath(); ctx.arc(cx + 20, cy - 5, 2.8, 0, Math.PI*2); ctx.fill(); }
        ctx.restore();
    }

    function pathRoundRect(ctx, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawCheckpoint(ctx, cp) {

            else { ctx.fillRect(cp.x, 230, 3, 120); ctx.fillRect(cp.x + 10, 230, 3, 120); }

    // Platforms are ligatures in white notation: void square heads joined side by side, oblique for the slopes,
    // with the stems that tell their values. A ligature about to fall is blackened (coloration) as a warning.
    function ligHead(c, x, y, w, h, filled, k) {
        if (T.segments) y += (hashf(k * 5.3 + x) - 0.5) * 1.2; // each head its own sort
        if (filled) { c.fillRect(x, y, w, h); return; }
        if (T.hand) { voidRect(c, x + 1.5, y + 1.5, w - 3, h - 3, 4.6); return; }
        const t = 4.2, v = 2.4;
        c.fillRect(x, y, w, t); c.fillRect(x, y + h - t, w, t); c.fillRect(x, y, v, h); c.fillRect(x + w - v, y, v, h);
    }
    function ligStem(c, x, y0, y1) {
        if (T.hand) nib(c, wob(x, y0, x + 0.3, y1, 0.4, 6), 3);
        else c.fillRect(x - 1.25, Math.min(y0, y1), 2.5, Math.abs(y1 - y0));
    }
    function ligOblique(c, x, y0, w, y1, h, filled) {
        // a parallelogram with upright ends, as the obliqua is cut
        const band = (dy, t) => { c.beginPath(); c.moveTo(x, y0 + dy); c.lineTo(x + w, y1 + dy); c.lineTo(x + w, y1 + dy + t); c.lineTo(x, y0 + dy + t); c.closePath(); c.fill(); };
        if (filled) { band(0, h); return; }
        if (!T.hand) { band(0, 4.2); band(h - 4.2, 4.2); c.fillRect(x, y0, 2.4, h); c.fillRect(x + w - 2.4, y1, 2.4, h); return; }
        nib(c, [[x + 1.5, y0 + 1.5], [x + w - 1.5, y1 + 1.5], [x + w - 1.5, y1 + h - 1.5], [x + 1.5, y0 + h - 1.5], [x + 1.5, y0 + 1.5]], 4.6);
    }
    function drawLigature(ctx, plat) {
        if (plat.type === 'ground') return;
        const shaking = plat.shakeTimer > 0 && plat.shakeTimer <= 30;
        const y = plat.y + (shaking ? Math.sin(plat.shakeTimer * 2) * 2 : 0), x = plat.x, w = plat.w, h = plat.h;
        const filled = shaking || plat.falling;
        ctx.fillStyle = C.ink; ctx.strokeStyle = C.ink;
        const seed = hashf(x * 0.013 + 3.1);
        if (plat.type === 'ice' || plat.type === 'descend') {
            // obliqua: rising for 'ice', falling for 'descend' (with the stem down on the left that makes its first note a breve)
            const up = plat.type === 'ice', y0 = up ? y : y - 20, y1 = up ? y - 20 : y;
            ligOblique(ctx, x, y0, w, y1, h, filled);
            if (!up) ligStem(ctx, x + 1.2, y0 + h - 2, y0 + h + 22);
            return;
        }
        if (plat.type === 'rising') {
            // two notes a step apart, the higher joined to the lower by its side
            const half = w / 2, n = Math.max(1, Math.round(half / 34)), hw = half / n;
            for (let i = 0; i < n; i++) ligHead(ctx, x + i * hw, y + 15, hw + 0.5, h, filled, i);
            for (let i = 0; i < n; i++) ligHead(ctx, x + half + i * hw, y, hw + 0.5, h, filled, i + 9);
            ligStem(ctx, x + half + 1.2, y + h - 2, y + 15 + h);
            if (seed < 0.5) ligStem(ctx, x + 1.2, y + 15 + h - 2, y + 15 + h + 22);
            return;
        }
        const n = Math.max(2, Math.round(w / 34)), hw = w / n;
        for (let i = 0; i < n; i++) ligHead(ctx, x + i * hw, y, hw + 0.5, h, filled, i);
        // first note: stem up on the left (cum opposita proprietate) or down (cum proprietate); last: a longa's tail on the right
        if (seed < 0.4) ligStem(ctx, x + 1.2, y + 2, y - 24);
        else if (seed < 0.75) ligStem(ctx, x + 1.2, y + h - 2, y + h + 22);
        if (seed > 0.3) ligStem(ctx, x + w - 1.2, y + h - 2, y + h + 26);
    }

    function draw() {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        syncTouchGameChrome();

        if (gameState === 'MENU' || gameState === 'OPTIONS') { drawMenu(); return; }
        if (gameMode === 'KART' && kart && ['PLAY', 'SPLASH', 'WIN', 'PAUSE'].includes(gameState)) { kartDraw(); return; }

        if (gameState === 'PLAY' || gameState === 'SPLASH' || gameState === 'DEATH_FREEZE' || gameState === 'WIN') {
            ctx.save(); ctx.translate(-cameraX, -cameraY);
            ctx.strokeStyle = C.staff; ctx.lineWidth = 1.5;
            if (gameMode !== 'GRADUS' && currentLevelData && currentLevelData.groundChunks) {

    // ===== Cursus: a kart race along a staff, drawn as a pseudo-3D road =====
    const KART = { SEG: 200, ROAD: 1000, DRAW: 170, CAM_H: 1000, HY: 166, VS: 200, LAPS: 3, KW: 0.14 };
    KART.depth = 1 / Math.tan(50 * Math.PI / 180);
    KART.playerZ = KART.CAM_H * KART.depth;
    const RIVALS = [
        { name: 'Maxima', note: 'MAXIMA', skill: 0.955 }, { name: 'Longa', note: 'LONGA', skill: 0.965 },
        { name: 'Brevis', note: 'BREVIS', skill: 0.985 }, { name: 'Semibrevis', note: 'SEMIBREVIS', skill: 0.975 },
        { name: 'Fusa', note: 'FUSA', skill: 0.995 }
    ];
    const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI'];
    let kart = null, kartTrack = null;
    const kmod = (n, m) => ((n % m) + m) % m;
    const klerp = (a, b, t) => a + (b - a) * t;

    function kartBuildTrack() {
        const S = KART.SEG, segs = [];
        const lastY = () => segs.length ? segs[segs.length - 1].p2.y : 0;
        const add = (curve, y) => { const i = segs.length; segs.push({ i, curve, p1: { y: lastY(), z: i * S }, p2: { y, z: (i + 1) * S }, sprites: [] }); };
        const easeIn = (a, b, t) => a + (b - a) * t * t;
        const easeInOut = (a, b, t) => a + (b - a) * (-Math.cos(t * Math.PI) / 2 + 0.5);
        const road = (enter, hold, leave, curve, hill) => {
            const y0 = lastY(), y1 = y0 + hill * S, n = enter + hold + leave; let k = 0;
            for (let i = 0; i < enter; i++) add(easeIn(0, curve, i / enter), easeInOut(y0, y1, ++k / n));
            for (let i = 0; i < hold; i++) add(curve, easeInOut(y0, y1, ++k / n));
            for (let i = 0; i < leave; i++) add(easeInOut(curve, 0, i / leave), easeInOut(y0, y1, ++k / n));
        };
        road(10, 60, 10, 0, 0);
        road(30, 60, 30, 3, 0);
        road(20, 50, 20, 0, 18);
        road(30, 80, 30, -4, 0);
        road(25, 40, 25, 0, -18);
        road(25, 50, 25, 5, 0);
        road(25, 50, 25, -5, 0);
        road(20, 60, 20, 0, 26);
        road(30, 90, 30, 3, -26);
        road(25, 50, 25, -2.5, 0);
        road(15, 50, 15, 0, 0);
        const N = segs.length, r = rng(11), signs = ['O', 'C', 'O.', 'C.', 'C|'];
        segs[3].sprites.push({ kind: 'banner', x: 0 });
        for (let i = 14; i < N - 6; i++) {
            const c = segs[i].curve;
            // mensuration signs on the outside of every bend
            if (Math.abs(c) > 1.5 && i % 6 === 0) segs[i].sprites.push({ kind: 'sign', x: c > 0 ? -1.3 : 1.3, sign: signs[(i / 6) % signs.length | 0], solid: true, hw: 0.13 });
            if (i % 5 === 0 && r() < 0.75) { const side = r() < 0.5 ? -1 : 1; segs[i].sprites.push({ kind: r() < 0.8 ? 'tree' : 'leaf', x: side * (1.5 + r() * 2.2), solid: true, hw: 0.2, seed: r() }); }
            if (i % 9 === 4 && r() < 0.5) segs[i].sprites.push({ kind: 'leaf', x: (r() < 0.5 ? -1 : 1) * (1.25 + r() * 0.3), solid: false, seed: r() });
        }
        const boxes = [];
        [0.16, 0.47, 0.76].forEach(f => [-0.6, -0.2, 0.2, 0.6].forEach(x => boxes.push({ seg: Math.floor(N * f), x, hidden: 0 })));
        return { segs, len: N * S, boxes };
    }

    function kartStart() {
        if (!kartTrack) kartTrack = kartBuildTrack();
        kartTrack.boxes.forEach(b => b.hidden = 0);
        const S = KART.SEG;
        resetPlayer(0, 0);
        const racer = (o, k) => Object.assign({ x: k % 2 ? 0.42 : -0.42, total: -S * (2 + Math.floor(k / 2) * 3), speed: 0, lap: 0, item: null, itemT: 0, roll: 0, drift: 0, charge: 0, hop: 0, boost: 0, star: 0, spin: 0, finish: null, lean: 0 }, o);
        const cars = RIVALS.map((r, i) => racer(Object.assign({ lane: 0 }, r), i < 4 ? i : 5));
        cars.forEach(c => c.lane = c.x);
        kart = {
            t: 0, count: 3.6, done: false, doneT: 0, bg: 0, tempus: 0, banner: 0, shake: 0, frame: 0,
            maxSpeed: S * 60 * 0.9 * speedSettings[difficultyIndex].mult,
            p: racer({ name: 'Minima', note: 'MINIMA', me: true, upWas: false, rocket: 0 }, 4),
            cars, flats: [], sharps: [], best: null
        };
        try { const b = parseFloat(localStorage.getItem('mensuratorKartBest')); if (b > 0) kart.best = b; } catch (e) {}
        currentLevel = 4; levelTime = 0;
        gameState = 'SPLASH';
    }

    const kartSeg = total => kartTrack.segs[Math.floor(kmod(total, kartTrack.len) / KART.SEG) % kartTrack.segs.length];
    const kartRacers = () => [kart.p, ...kart.cars];
    function kartOrder() {
        return kartRacers().sort((a, b) => (a.finish != null && b.finish != null) ? a.finish - b.finish : a.finish != null ? -1 : b.finish != null ? 1 : b.total - a.total);
    }
    function kartPickItem(place) {
        const tables = [
            [['flat', 5], ['sharp', 4], ['allabreve', 1]],
            [['sharp', 35], ['flat', 25], ['allabreve', 30], ['tempus', 5], ['ink', 5]],
            [['allabreve', 35], ['ink', 20], ['tempus', 20], ['sharp', 25]]
        ];
        const t = tables[place === 1 ? 0 : place <= 3 ? 1 : 2];
        let r = Math.random() * t.reduce((s, e) => s + e[1], 0);
        for (const [k, w] of t) { if ((r -= w) < 0) return k; }
        return t[0][0];
    }
    function kartSpin(r) {
        if (r.star > 0 || r.spin > 0) return;
        r.spin = 1; r.drift = 0; r.charge = 0;
        playSound(r.me ? 'damage' : 'smash');
    }
    function kartUseItem(r) {
        const it = r.item;
        if (!it || r.roll > 0 || !kart || kart.count > 0) return;
        r.item = null;
        const L = kartTrack.len;
        if (it === 'allabreve') { r.boost = 1.2; if (r.me) playSound('allaBreve'); }

    function kartUpdate() {
        const dt = 1 / 60, S = KART.SEG, L = kartTrack.len, N = kartTrack.segs.length, p = kart.p, max = kart.maxSpeed;
        kart.frame++;
        if (kart.count > 0) {
            const before = Math.ceil(kart.count);
            kart.count -= dt;
            p.rocket = keys.up ? p.rocket + dt : 0;
            if (Math.ceil(kart.count) !== before && before <= 3 && kart.count > 0) playSound('point');
            if (kart.count <= 0) { playSound('allaBreve'); if (p.rocket > 0.1 && p.rocket < 1.1) p.boost = 1; p.upWas = keys.up; }
            return;
        }
        if (!kart.done) kart.t += dt; else kart.doneT += dt;
        if (kart.done && kart.doneT > 2.5 && gameState === 'PLAY') { gameState = 'WIN'; if (musicTimeout) clearTimeout(musicTimeout); }
        if (kart.tempus > 0) kart.tempus -= dt;
        if (kart.banner > 0) kart.banner -= dt;
        if (kart.shake > 0) kart.shake -= dt;

        // --- the player ---
        const seg = kartSeg(p.total), pct = p.speed / max;
        const auto = kart.done;
        const ahead = kartTrack.segs[(seg.i + 10) % N];
        const steer = auto ? Math.sign(Math.round((-ahead.curve * 0.08 - p.x) * 4)) : (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
        const up = !auto && keys.up, down = !auto && keys.down;
        // hop on the drift key; hold it through a bend for a burst of speed when released
        if (up && !p.upWas) { p.hop = 0.22; playSound('jump'); if (steer !== 0 && pct > 0.4 && p.spin <= 0) { p.drift = steer; p.charge = 0; } }

            p.drift = 0; p.charge = 0;
        }
        p.upWas = up;
        if (p.hop > 0) p.hop -= dt;
        const dx = dt * 2.2 * pct;
        if (p.drift) { p.x += dx * (p.drift * 0.62 + steer * 0.55); p.charge += dt * (steer === p.drift ? 1.4 : 0.8); p.x -= dx * pct * seg.curve * 0.14; }
        else { p.x += dx * steer; p.x -= dx * pct * seg.curve * 0.24; }

        if (p.boost > 0) p.boost -= dt;
        if (p.star > 0) { p.star -= dt; player.colorationTimer = Math.max(0, p.star * 60); } else player.colorationTimer = 0;
        const top = max * (p.boost > 0 ? 1.3 : 1) * (p.star > 0 ? 1.15 : 1);
        const off = Math.abs(p.x) > 1;
        if (p.spin > 0) { p.spin -= dt; p.speed *= 0.94; }

        else if (p.speed < top) p.speed = Math.min(top, p.speed + max * (p.boost > 0 ? 1.6 : 0.3) * dt);
        else p.speed = Math.max(top, p.speed - max * 0.4 * dt);
        if (off && p.star <= 0 && p.speed > max * 0.35) p.speed -= max * 0.9 * dt;
        p.speed = Math.max(0, p.speed);
        p.x = Math.max(-2.3, Math.min(2.3, p.x));
        if (off) for (const s of seg.sprites) {
            if (s.solid && Math.abs(p.x - s.x) < s.hw + KART.KW) {
                if (p.star > 0) break;
                p.speed = Math.min(p.speed, max * 0.12); p.x += (p.x > s.x ? 1 : -1) * 0.07; kart.shake = 0.3; playSound('damage');

            }
        }
        const dz = p.speed * dt;
        p.total += dz;
        kart.bg += seg.curve * (dz / S) * 0.0016;

        // --- rivals ---
        for (const c of kart.cars) {
            const cs = kartSeg(c.total), ca = kartTrack.segs[(cs.i + 12) % N];
            if (c.boost > 0) c.boost -= dt;

            }

    }

    // ----- drawing -----
    function kartTime(t) { if (t == null) return '–'; const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s < 10 ? '0' : ''}${s.toFixed(2)}`; }

    function kartTree(sx, sy, k, seed) {

        ctx.fillRect(-24, -380, 48, 380);
        const rx = 210 + seed * 70, ry = 250 + seed * 60, cy = -380 - ry * 0.85, rb = rx * 0.45;

        ctx.fillStyle = C.ink;

        ctx.fillStyle = body;

    function kartItemGlyph(it, x, y, s = 1) {

    }

    function kartDraw() {
        const K = KART, tr = kartTrack, segs = tr.segs, N = segs.length, L = tr.len, S = K.SEG, p = kart.p;
        const shake = kart.shake > 0 ? (Math.random() - 0.5) * 4 : 0;
        ctx.save(); ctx.translate(shake, 0);
        kartBackdrop(kart.bg);

        const camZ = kmod(p.total - K.playerZ, L);

            const items = (bucket.get(seg.i) || []).sort((u, v) => v[0] - u[0]);

            for (const [pc, o] of all) {
                const s = klerp(seg.a.s, seg.b.s, pc), x0 = klerp(seg.a.x, seg.b.x, pc), sy = klerp(seg.a.y, seg.b.y, pc);
