<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MENSURATOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Noto+Music&display=swap">
    <style>
        :root {
            --bg: #fbf7ef;
            --paper: #fffdf8;
            --band: #f1e8d8;
            --ink: #3b3125;
            --soft: #8a7b66;
            --line: #e0d4c0;
            --mark: #9c6b3c;
            --red: #b5473a;
            --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color-scheme: light;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            font-family: var(--sans);
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #gameWrapper {
            position: relative;
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 12px;
        }

        #canvasContainer {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 2 / 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 1px 2px rgba(59, 49, 37, 0.05), 0 10px 30px rgba(59, 49, 37, 0.07);
            transition: filter 0.15s;
            display: block;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .bullet-time { filter: grayscale(0.85) contrast(1.05); }
        .alla-breve { filter: saturate(1.6) hue-rotate(-12deg); }

        .html-btn {
            display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; padding: 0;
            background: rgba(255, 253, 248, 0.85);
            color: var(--ink);
            border: 1px solid var(--line);
            font-family: inherit; font-size: 16px; font-weight: 600;
            border-radius: 999px; cursor: pointer;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .html-btn:hover { border-color: var(--mark); }
        .html-btn:active { background: var(--band); }
        #fsBtn { position: absolute; top: 12px; left: 12px; z-index: 20; }

        /* Draggable Shoot Button */
        #tShootDraggable {
            position: absolute;
            right: 15%;
            top: 35%;
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(255, 253, 248, 0.55);
            border: 1.5px solid rgba(156, 107, 60, 0.45);
            color: var(--mark);
            font-size: 22px; font-weight: 700;
            display: none; justify-content: center; align-items: center;
            user-select: none; -webkit-user-select: none;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 4px 14px rgba(59, 49, 37, 0.08);
            z-index: 35;
        }
        #tShootDraggable:active { background: var(--mark); color: var(--paper); }

        #tPause {
            position: fixed; top: 10px; right: 10px; width: 44px; height: 44px;
            font-size: 13px; font-weight: 800; letter-spacing: 1px; border-radius: 50%;
            background: rgba(255, 253, 248, 0.85); border: 1px solid var(--line); color: var(--ink);
            display: none; justify-content: center; align-items: center; z-index: 35;
            box-shadow: 0 4px 14px rgba(59, 49, 37, 0.08);
        }

        #touchZonesOverlay .zone {
            position: absolute; top: 0; height: 100%;
            display: flex; align-items: center; justify-content: center;
            color: rgba(156, 107, 60, 0.45); font-size: 14px; font-weight: 600; letter-spacing: 2px;
        }
        #touchZonesOverlay .zone + .zone { border-left: 1px dashed rgba(156, 107, 60, 0.25); }

        @media (orientation: portrait) {
            body { justify-content: flex-start; }
            #gameWrapper { flex-direction: column; justify-content: flex-start; height: 100%; }
            #canvasContainer { flex-shrink: 0; margin-top: 10px; }
        }

        #titleDevBtn {
            position: fixed;
            bottom: 12px;
            left: 12px;
            z-index: 25;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--soft);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
        }
        #titleDevBtn:hover { color: var(--ink); border-color: var(--mark); }

        /* Overlays and panels */
        .overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(251, 247, 239, 0.72);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            z-index: 30; justify-content: center; align-items: center; flex-direction: column;
        }
        .menu-box {
            background: var(--paper); color: var(--ink);
            padding: 28px 32px; border: 1px solid var(--line); border-radius: 18px;
            box-shadow: 0 20px 50px rgba(59, 49, 37, 0.14);
            text-align: center; pointer-events: auto; max-width: 92%; width: 440px;
        }
        .menu-box h2 { margin: 0 0 18px; color: var(--ink); font-size: 22px; font-weight: 800; letter-spacing: 3px; }
        .menu-box p { color: var(--soft); font-size: 14px; margin: 0 0 8px; }
        .menu-box hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
        .slider-container { margin: 14px 0; font-size: 13px; font-weight: 500; color: var(--soft); text-align: left; }
        .slider-container label { display: block; }
        .slider-value { float: right; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
        .speed-name { display: block; margin-top: 4px; color: var(--ink); font-weight: 600; font-size: 14px; }
        .slider-container input[type=range] { width: 100%; margin-top: 10px; cursor: pointer; accent-color: var(--mark); }
        .menu-btn {
            background: var(--ink); color: var(--paper); border: 1px solid var(--ink);
            padding: 11px 20px; font-family: inherit; font-size: 15px; font-weight: 600;
            border-radius: 999px; cursor: pointer; margin: 6px 4px;
        }
        .menu-btn:hover { background: #2a231a; }
        .menu-btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
        .menu-btn.ghost:hover { border-color: var(--mark); }
        .menu-btn.danger { background: transparent; color: var(--red); border-color: rgba(181, 71, 58, 0.4); }
        .menu-btn.danger:hover { border-color: var(--red); }
        .menu-btn.block { display: block; width: 100%; margin: 0 0 10px; }
        .dev-section-label { color: var(--mark); font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
        .dev-stage-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
        .dev-stage-btn {
            padding: 9px 4px; font-family: inherit; font-size: 13px; font-weight: 600;
            border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
        }
        .dev-stage-btn:hover { border-color: var(--mark); }
        .dev-warp {
            display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
            margin: 12px 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
        }
        .dev-warp label { color: var(--ink); font-weight: 600; font-size: 13px; }
        .dev-warp input {
            width: 64px; padding: 6px; font-family: inherit; font-size: 15px; font-weight: 600; text-align: center;
            color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
        }
        .dev-check { color: var(--red); font-weight: 700; cursor: pointer; text-align: center; }
        .dev-check input { width: auto; margin-right: 8px; accent-color: var(--red); }

        #mobileNameInputOverlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(251, 247, 239, 0.96);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: var(--sans); color: var(--ink); text-align: center; padding: 16px;
        }
        #mobileNameInputOverlay .t { font-size: 28px; font-weight: 800; letter-spacing: 3px; margin-bottom: 14px; }
        #mobileNameInputOverlay .s { font-size: 15px; color: var(--soft); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
        #mobileNameInputOverlay .p { font-size: 14px; font-weight: 600; color: var(--mark); margin: 16px 0 10px; }
        #mobileNameInput {
            font-family: inherit; font-size: 17px; font-weight: 600; text-align: center;
            padding: 10px 14px; width: 220px; margin-bottom: 18px;
            color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; outline: none;
        }
        #mobileNameInput:focus { border-color: var(--mark); }
        #mobileNameInputOverlay .row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="canvasContainer">
        <button id="fsBtn" class="html-btn" aria-label="Fullscreen">⛶</button>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="tPause">II</div>
    </div>
</div>

<div id="touchZonesOverlay" style="display:none; pointer-events:none; position:fixed; left:0; top:0; width:100vw; height:0; z-index:4;">
    <div class="zone" style="left:0; width:18%;">◀</div>
    <div class="zone" style="left:18%; width:27%;">▶</div>
    <div class="zone" style="left:45%; width:55%;">▲ JUMP</div>
</div>

<div id="tShootDraggable">●</div>

<button type="button" id="titleDevBtn" aria-label="Developer mode">DEV</button>

<div id="devOverlay" class="overlay" style="z-index: 40;">
    <div class="menu-box" style="width: 480px; max-height: 92vh; overflow-y: auto;">
        <h2>Modus Formatoris</h2>
        <p>Stadium Classicum (I–VIII) vel pugna cum Diabolo.</p>
        <div class="dev-stage-grid" id="devStageGrid"></div>
        <button type="button" class="menu-btn danger block" id="devBossBtn">Pugna: MI-FA (Boss)</button>
        <div class="dev-warp">
            <label for="devEndlessLevelInput">Endless Mode Warp (0-23):</label>
            <input type="number" id="devEndlessLevelInput" min="0" max="23" value="0">
            <button type="button" class="menu-btn" id="devEndlessJumpBtn" style="margin: 0; padding: 7px 16px;">WARP</button>
        </div>
        <button type="button" class="menu-btn ghost block" id="devLeaderboardBtn">Test: Nomen in Tabella</button>
        <button type="button" class="menu-btn danger block" id="devResetLeaderboardBtn">Reset Leaderboard</button>
        <button type="button" class="menu-btn block" id="devCloseBtn">Claudere</button>
    </div>
</div>

<div id="pauseOverlay" class="overlay">
    <div class="menu-box" style="max-height: 88vh; overflow-y: auto;">
        <h2>PAUSATUM</h2>

        <button class="menu-btn block" onclick="togglePause()">Resume</button>
        <button class="menu-btn ghost block" onclick="quitToMenu()">Quit to Title</button>

        <hr>

        <div class="slider-container">
            <label>Mensura (Game Speed) <span id="speedLabel" class="speed-name">Tempus perfectum prolatio minor</span>
            <input type="range" id="speedSlider" min="0" max="4" step="1" value="2" oninput="updateSpeedLabel()"></label>
        </div>
        <div class="slider-container">
            <label>Musica Vol <span class="slider-value" id="musicVolValue">0.8</span><input type="range" id="musicVol" min="0" max="1" step="0.05" value="0.8" oninput="updateSliderValue('musicVolValue', this.value)"></label>
        </div>
        <div class="slider-container">
            <label>Effectus Vol <span class="slider-value" id="fxVolValue">0.4</span><input type="range" id="fxVol" min="0" max="1" step="0.05" value="0.4" oninput="updateSliderValue('fxVolValue', this.value)"></label>
        </div>
        <div id="devPhysicsSection" style="display: none;">
            <hr>
            <div class="dev-section-label">⚙ DEV MODE: Physics Tweaker</div>
            <div class="slider-container">
                <label>Gravitas <span class="slider-value" id="gravityValue">0.6</span><input type="range" id="gravitySlider" min="0.2" max="1.0" step="0.1" value="0.6" oninput="updateSliderValue('gravityValue', this.value)"></label>
            </div>
            <div class="slider-container">
                <label>Saltus Altitudo (Jump Height) <span class="slider-value" id="jumpPowerValue">9</span><input type="range" id="jumpPowerSlider" min="5" max="13" step="1" value="9" oninput="updateSliderValue('jumpPowerValue', this.value)"></label>
            </div>
            <div class="slider-container">
                <label>Celeritas Pedestris (Walk Speed) <span class="slider-value" id="walkSpeedValue">6.5</span><input type="range" id="walkSpeedSlider" min="3" max="10" step="0.5" value="6.5" oninput="updateSliderValue('walkSpeedValue', this.value)"></label>
            </div>
            <div class="slider-container">
                <label>Cursus Velocitas (Sprint Speed) <span class="slider-value" id="sprintSpeedValue">12</span><input type="range" id="sprintSpeedSlider" min="8" max="16" step="1" value="12" oninput="updateSliderValue('sprintSpeedValue', this.value)"></label>
            </div>
            <div class="slider-container dev-check">
                <label>
                    <input type="checkbox" id="devInvincibilityToggle">
                    INVINCIBILITY
                </label>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById('fsBtn').addEventListener('click', () => {
        let elem = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    // Logical game size is 800x400; the backing store is scaled for sharp rendering on high-density screens
    const W = 800, H = 400;
    const DPR = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = W * DPR; canvas.height = H * DPR;
    
    const pauseOverlay = document.getElementById('pauseOverlay');
    const touchZonesOverlay = document.getElementById('touchZonesOverlay');
    const shootBtn = document.getElementById('tShootDraggable');
    const tPause = document.getElementById('tPause');
    const canvasContainer = document.getElementById('canvasContainer');
    const titleDevBtn = document.getElementById('titleDevBtn');
    const devOverlay = document.getElementById('devOverlay');
    const devStageGrid = document.getElementById('devStageGrid');
    const devBossBtn = document.getElementById('devBossBtn');
    const devCloseBtn = document.getElementById('devCloseBtn');

    for (let i = 0; i < 8; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dev-stage-btn';
        b.textContent = 'Modus ' + (i + 1);
        b.addEventListener('click', () => devPickStage(i));
        devStageGrid.appendChild(b);
    }
    devBossBtn.addEventListener('click', () => devPickBoss());
    const devEndlessJumpBtn = document.getElementById('devEndlessJumpBtn');
    devEndlessJumpBtn.addEventListener('click', () => {
        let targetLevel = parseInt(document.getElementById('devEndlessLevelInput').value) || 0;
        if (targetLevel < 0) targetLevel = 0;
        if (targetLevel > 23) targetLevel = 23;
        
        window.endlessStartLevel = targetLevel;
        gameMode = 'ENDLESS';
        currentLevel = targetLevel;
        closeDevPanel();
        if (gameState === 'PAUSE') togglePause();
        startGame();
    });
    const devLeaderboardBtn = document.getElementById('devLeaderboardBtn');
    devLeaderboardBtn.addEventListener('click', () => devTestLeaderboard());
    const devResetLeaderboardBtn = document.getElementById('devResetLeaderboardBtn');
    devResetLeaderboardBtn.addEventListener('click', () => devResetLeaderboard());
    devCloseBtn.addEventListener('click', () => closeDevPanel());
    
    titleDevBtn.addEventListener('click', () => { 
        if (gameState === 'MENU') {
            if (devOverlay.style.display === 'flex') {
                closeDevPanel();
            } else {
                if (isDevUnlocked) {
                    openDevPanel();
                } else {
                    const pwd = prompt("Introduce tesseram (Enter Password):");
                    if (pwd === "67") {
                        isDevUnlocked = true;
                        document.getElementById('devPhysicsSection').style.display = 'block';
                        openDevPanel();
                    } else if (pwd !== null) {
                        alert("Accessus interdictus! (Access Denied)");
                    }
                }
            }
        }
    });
    function openDevPanel() { devOverlay.style.display = 'flex'; }
    function closeDevPanel() { devOverlay.style.display = 'none'; }
    function devPickStage(n) {
        gameMode = 'CLASSIC';
        currentLevel = n;
        closeDevPanel();
        startGame();
    }
    function devPickBoss() {
        gameMode = 'CLASSIC';
        currentLevel = 7;
        window.skipToBoss = true; // Tell startGame to teleport the player
        closeDevPanel();
        startGame();
    }
    function devTestLeaderboard() {
        player.score = Math.floor(Math.random() * 500) + 100;
        levelTime = Math.floor(Math.random() * 300) + 120;
        inputName = '';
        if (!currentLevelData) { currentLevelData = { hasFuga: false, goal: { x: 100 } }; }
        gameState = 'NAME_INPUT';
        closeDevPanel();
    }
    
    function devResetLeaderboard() {
        if (confirm(`Are you sure you want to reset the ${currentLeaderboardMode} leaderboard? This will delete all entries!`)) {
            leaderboard = [];
            const codes = getDreamloCodes(currentLeaderboardMode);
            const targetUrl = `http://dreamlo.com/lb/${codes.priv}/clear`;
            const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`;
            
            fetch(proxyUrl)
            .then(response => {
                if (response.ok) {
                    alert(`${currentLeaderboardMode} Leaderboard has been reset.`);
                    loadLeaderboard();
                } else { alert('Failed to reset leaderboard.'); }
            })
            .catch(error => { alert('Error resetting leaderboard.'); });
        }
    }
    
    const musicVolSlider = document.getElementById('musicVol');
    const fxVolSlider = document.getElementById('fxVol');
    const speedSlider = document.getElementById('speedSlider');
    const speedLabel = document.getElementById('speedLabel');
    const decaySlider = document.getElementById('decaySlider');
let isDevUnlocked = false;
let devInvincible = false;
    // Dev Mode Physics Sliders
    const gravitySlider = document.getElementById('gravitySlider');
    const jumpPowerSlider = document.getElementById('jumpPowerSlider');
    const walkSpeedSlider = document.getElementById('walkSpeedSlider');
    const sprintSpeedSlider = document.getElementById('sprintSpeedSlider');
    const devInvincibilityToggle = document.getElementById('devInvincibilityToggle');
    if (devInvincibilityToggle) {
        devInvincibilityToggle.addEventListener('change', (e) => { devInvincible = e.target.checked; });
    }

    let audioCtx; let musicTimeout; let melodyIndex = 0; let audioUnlocked = false; let isMuted = false;
    let isTouchDevice = false;

    // --- Difficulty / Global Speed Settings ---
    const speedSettings = [
        { name: "Modus cum tempore", mult: 0.8 }, 
        { name: "Tempus perfectum prolatio major", mult: 0.9 }, 
        { name: "Tempus perfectum prolatio minor", mult: 1.0 }, // Default
        { name: "Tempus imperfectum prolatio major", mult: 1.1 },
        { name: "Tempus imperfectum prolatio minor", mult: 1.2 } 
    ];
    let difficultyIndex = 2; 

    function updateSpeedLabel() {
        difficultyIndex = parseInt(speedSlider.value);
        speedLabel.innerText = speedSettings[difficultyIndex].name;
    }

    function updateSliderValue(elementId, value) {
        document.getElementById(elementId).textContent = value;
    }

    // --- Global Leaderboard System ---
    let leaderboard = [];
    let inputName = '';
    let showNameInput = false;

    const DREAMLO_PUBLIC_CLASSIC = '69c672f28f40bc2f6084f817';
    const DREAMLO_PRIVATE_CLASSIC = '_VKanEz7lkSQ2iLJrCvVrgTthj6suPakGd3nNlMedDUA';

    const DREAMLO_PUBLIC_ENDLESS = '69c69bd88f40bc2f6086c41f';
    const DREAMLO_PRIVATE_ENDLESS = 'jvDcnsBwJk6fya1GUA8-yQ_PSo9L5Oj0mj9WB6QeIvTQ';

    const PROXY_URL = 'https://api.codetabs.com/v1/proxy?quest=';
    let currentLeaderboardMode = 'CLASSIC'; 

    function getDreamloCodes(mode) {
        if (mode === 'ENDLESS') return { pub: DREAMLO_PUBLIC_ENDLESS, priv: DREAMLO_PRIVATE_ENDLESS };
        return { pub: DREAMLO_PUBLIC_CLASSIC, priv: DREAMLO_PRIVATE_CLASSIC };
    }

    async function loadLeaderboard() {
        try {
            const codes = getDreamloCodes(currentLeaderboardMode);
            const targetUrl = `http://dreamlo.com/lb/${codes.pub}/json`;
            const proxyUrl = `${PROXY_URL}${encodeURIComponent(targetUrl)}`;
            
            const response = await fetch(proxyUrl);

            if (response.ok) {
                const data = await response.json();
                leaderboard = [];
                if (data.dreamlo && data.dreamlo.leaderboard && data.dreamlo.leaderboard.entry) {
                    const entries = Array.isArray(data.dreamlo.leaderboard.entry) 
                        ? data.dreamlo.leaderboard.entry 
                        : [data.dreamlo.leaderboard.entry];
                    
                    entries.forEach(entry => {
                        leaderboard.push({
                            name: entry.name,
                            score: parseInt(entry.score),
                            time: entry.seconds ? parseInt(entry.seconds) : 0
                        });
                    });
                }
            }
        } catch (error) { console.log('Failed to load from Dreamlo:', error); }
        
        leaderboard.sort((a, b) => b.score - a.score);
        leaderboard = leaderboard.slice(0, 10);
    }

    async function addToLeaderboard(name, score, time) {
        if (!name || name.trim() === "") return;
        const cleanName = name.trim().replace(/[^a-zA-Z0-9]/g, "");

        try {
            const codes = getDreamloCodes(gameMode);
            const targetUrl = `http://dreamlo.com/lb/${codes.priv}/add/${encodeURIComponent(cleanName)}/${score}/${Math.floor(time)}`;
            const proxyUrl = `${PROXY_URL}${encodeURIComponent(targetUrl)}`;
            
            const response = await fetch(proxyUrl);
            if (response.ok) {
                setTimeout(() => {
                    loadLeaderboard();
                }, 500);
            }
        } catch (error) { console.log('Failed to add to Dreamlo:', error); }
    }

    // --- Visual Style ---
    const C = {
        bg: '#fbf7ef', paper: '#fffdf8', band: '#f1e8d8', ink: '#3b3125', inkSoft: '#5c4f3e', soft: '#8a7b66',
        line: '#e0d4c0', staff: '#d8cab2', mark: '#9c6b3c', red: '#b5473a', redHot: '#dc5a43', blue: '#3f6c9c',
        gold: '#c49a2c', silver: '#9a9a96', bronze: '#b07a4a'
    };
    const SANS = '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

    // --- Inputs & Unified Menu Handling ---

    function handleTouchZones(e) {
        if (gameState === 'NAME_INPUT') {
            // If player is tapping on the HTML overlay (input box or buttons), let browser handle it!
            if (e.target.closest('#mobileNameInputOverlay')) {
                return; 
            }
            e.preventDefault();
            showMobileNameInput();
            return;
        }
        
        if (gameState === 'LEADERBOARD') {
            e.preventDefault();
            // Check if close button was touched
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0] || e.changedTouches[0];
            const x = (touch.clientX - rect.left) / (rect.width / W);
            const y = (touch.clientY - rect.top) / (rect.height / H);
            
            const closeBtnSize = 30;
            const closeBtnX = W - closeBtnSize - 10;
            const closeBtnY = 10;
            
            if (x >= closeBtnX && x <= closeBtnX + closeBtnSize && 
                y >= closeBtnY && y <= closeBtnY + closeBtnSize) {
                gameState = 'MENU';
            }
            return;
        }
        
        if (gameState !== 'PLAY') return;
        e.preventDefault();
        
        let touches = e.touches;
        let nowLeft = false, nowRight = false, nowJump = false, nowShoot = false;
        
        for(let i=0; i<touches.length; i++) {
            let x = touches[i].clientX;
            let y = touches[i].clientY;
            let w = window.innerWidth;
            let target = document.elementFromPoint(x, y);
            if (target && (target.id === 'tPause' || target.closest && target.closest('#tPause'))) continue;
            if (target && (target.id === 'tShootDraggable' || target.closest && target.closest('#tShootDraggable'))) {
                nowShoot = true;
                continue;
            }
            // Height restriction removed so zones extend to the top of the screen!
            
            // New touch boundaries (18% and 45%)
            if (x < w * 0.18) nowLeft = true;
            else if (x < w * 0.45) nowRight = true;
            else nowJump = true;
        }
        
        if (nowLeft && !keys.left) pressLeft();
        if (!nowLeft && keys.left) releaseLeft();
        
        if (nowRight && !keys.right) pressRight();
        if (!nowRight && keys.right) releaseRight();
        
        if (nowJump && !keys.up) pressJump();
        if (!nowJump && keys.up) releaseJump();

        if (nowShoot && !keys.space) pressShoot();
        if (!nowShoot && keys.space) releaseShoot();
    }

    function startGame() {

        levelTime = 0;

    function drawMensuralNote(ctx, x, y, stateName, isInvulnerable, opacity = 1, isColored = false, isGhost = false) {
        ctx.save(); const cx = x + 12; const cy = y + 35; let isDotted = stateName.startsWith('DOTTED_'); let baseState = stateName.replace('DOTTED_', '');
        const inkA = `rgba(59, 49, 37, ${opacity})`;
        if (isGhost) { ctx.fillStyle = 'rgba(181, 71, 58, 0.55)'; ctx.strokeStyle = 'rgba(181, 71, 58, 0.55)'; }
        else if (isColored) { if (player.colorationTimer < 60 && Math.floor(Date.now() / 100) % 2 === 0) { ctx.fillStyle = inkA; ctx.strokeStyle = inkA; } else { ctx.shadowBlur = 14; ctx.shadowColor = 'rgba(156, 107, 60, 0.85)'; ctx.fillStyle = '#1f1a14'; ctx.strokeStyle = '#1f1a14'; } }
        else { ctx.fillStyle = inkA; ctx.strokeStyle = inkA; }
        const hollow = C.paper;
        switch(baseState) {
            case 'FUSA': drawDiamond(ctx, cx, cy, 10, true); ctx.fillRect(cx - 1.25, cy - 45, 2.5, 35); ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy - 45); ctx.quadraticCurveTo(cx + 12, cy - 20, cx + 18, cy - 20); ctx.stroke(); break;
            case 'SEMIMINIMA': drawDiamond(ctx, cx, cy, 10, true); ctx.fillRect(cx - 1.25, cy - 35, 2.5, 25); break;
            case 'MINIMA': drawDiamond(ctx, cx, cy, 10, isColored || isGhost); ctx.fillRect(cx - 1.25, cy - 35, 2.5, 25); break;
            case 'SEMIBREVIS': drawDiamond(ctx, cx, cy, 13, isColored || isGhost); break;
            case 'BREVIS': ctx.lineWidth = 2.5; if (isColored || isGhost) { pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, 3); ctx.fill(); } else { pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, 3); ctx.stroke(); } break;
            case 'LONGA': ctx.lineWidth = 2.5; if (isColored || isGhost) { pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, 3); ctx.fill(); } else { const f = ctx.fillStyle; ctx.fillStyle = hollow; pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, 3); ctx.fill(); ctx.fillStyle = f; ctx.stroke(); } ctx.fillRect(cx + 9, cy, 2.5, 30); break;
            case 'MAXIMA': ctx.lineWidth = 2.5; if (isColored || isGhost) { pathRoundRect(ctx, cx - 18, cy - 12, 36, 24, 3); ctx.fill(); } else { const f = ctx.fillStyle; ctx.fillStyle = hollow; pathRoundRect(ctx, cx - 18, cy - 12, 36, 24, 3); ctx.fill(); ctx.fillStyle = f; ctx.stroke(); } ctx.fillRect(cx + 16, cy, 2.5, 35); break;
        }

    }

    function pathRoundRect(ctx, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawCheckpoint(ctx, cp) {
        const col = cp.active ? C.mark : 'rgba(156, 107, 60, 0.28)';
        ctx.fillStyle = col;
        pathRoundRect(ctx, cp.x, 230, 3, 120, 1.5); ctx.fill();
        pathRoundRect(ctx, cp.x + 10, 230, 3, 120, 1.5); ctx.fill();
        ctx.textAlign = 'left'; ctx.font = `40px ${MUSIC}`; ctx.fillText('𝄐', cp.x - 10, 220);
        if (cp.active) { ctx.font = font(12, 600); ctx.fillText(cp.label, cp.x - 20, 180); }
    }

    function drawLigature(ctx, plat) {
        if (plat.type === 'ground') return; ctx.fillStyle = C.ink; let drawY = plat.y + (plat.shakeTimer > 0 && plat.shakeTimer <= 30 ? Math.sin(plat.shakeTimer * 2) * 2 : 0);
        if (plat.shakeTimer > 0 && plat.shakeTimer <= 30) ctx.fillStyle = C.inkSoft;
        if (plat.type === 'ice') {
            ctx.beginPath(); ctx.moveTo(plat.x, drawY); ctx.lineTo(plat.x + plat.w, drawY - 20); ctx.lineTo(plat.x + plat.w, drawY + plat.h - 20); ctx.lineTo(plat.x, drawY + plat.h); ctx.closePath(); ctx.fill(); ctx.fillRect(plat.x + plat.w - 3, drawY - 20, 3, 35);
        } else if (plat.type === 'descend') {
            ctx.beginPath(); ctx.moveTo(plat.x, drawY - 20); ctx.lineTo(plat.x + plat.w, drawY); ctx.lineTo(plat.x + plat.w, drawY + plat.h); ctx.lineTo(plat.x, drawY + plat.h - 20); ctx.closePath(); ctx.fill(); ctx.fillRect(plat.x + plat.w - 3, drawY, 3, 35);
        } else if (plat.type === 'rising') {
            pathRoundRect(ctx, plat.x, drawY + 15, plat.w / 2, plat.h, 3); ctx.fill(); pathRoundRect(ctx, plat.x + plat.w / 2, drawY, plat.w / 2, plat.h, 3); ctx.fill(); ctx.fillRect(plat.x + plat.w / 2 - 1.5, drawY, 3, 15 + plat.h); ctx.fillRect(plat.x + plat.w - 3, drawY, 3, 35);
        } else {
            pathRoundRect(ctx, plat.x, drawY, plat.w, plat.h, 3); ctx.fill(); ctx.fillRect(plat.x + plat.w - 3, drawY, 3, 35);
        }
    }

    function drawMenu() {

        ctx.strokeStyle = C.line; ctx.lineWidth = 1;

        ctx.fillStyle = C.mark;

        let titleSize = 58;

    function drawStatusPill(text, color, y) {

    function draw() {

            ctx.fillStyle = C.red; ctx.font = font(12, 600); ctx.fillText('MI-FA (Diabolus in Musica)', boss.x - 40, boss.y - 30);
            ctx.fillStyle = C.red; ctx.font = `26px ${MUSIC}`; boss.projectiles.forEach(bp => { ctx.fillText(Math.random() > 0.5 ? '♭' : '♯', bp.x, bp.y + 20); });

        ctx.fillStyle = C.ink; currentLevelData.inkPots.forEach(pot => { if (pot.active) { ctx.beginPath(); ctx.arc(pot.x + 10, pot.y + 15, 10, 0, Math.PI*2); ctx.fill(); pathRoundRect(ctx, pot.x + 5, pot.y, 10, 10, 2); ctx.fill(); } });

        ctx.fillStyle = C.red; ctx.font = `30px ${MUSIC}`; currentLevelData.jumpingFlats.forEach(flat => { if (!flat.dead && flat.state !== 'hidden') ctx.fillText('♭', flat.x, flat.y + 25); });
        ctx.fillStyle = C.red; ctx.font = `40px ${MUSIC}`; currentLevelData.flyingEnemies.forEach(e => { if(!e.dead) ctx.fillText('♯', e.x, e.y + 35); });

        else if (gameMode === 'GRADUS') { ctx.fillStyle = 'rgba(59, 49, 37, 0.9)'; ctx.fillRect(-1000, cameraY + H + 24, W + 2000, 1000); ctx.fillStyle = C.red; ctx.fillRect(-1000, cameraY + H + 24, W + 2000, 2); }

            ctx.textAlign = 'center';

            if (splashLabel) {

            let nameSize = 42;

            ctx.fillStyle = C.ink;

            const maxWidth = 640;

        } else if (gameState !== 'DEATH_FREEZE' && gameState !== 'WIN' && gameState !== 'MENU' && gameState !== 'PAUSE') {

                ctx.font = font(26, 800); spacing(2);
                if (Math.floor(Date.now() / 400) % 2 === 0) {
                    ctx.fillText(isTouchDevice ? 'SHOOT!' : 'SHOOT WITH SPACEBAR!', W / 2, 120);
                }
                spacing(0);
            }

            if (!isTouchDevice) {
                ctx.fillStyle = C.soft;
                ctx.font = font(11, 500);
                ctx.textAlign = 'center';
                ctx.fillText('< > = Run/Sprint | ^ = Jump | SPACE = Shoot | ESC = Pause', W / 2, H - 18);
            }
            }
        }

        if (gameState === 'DEATH_FREEZE') {
            veil(0.8);

            ctx.textAlign = 'center';
            ctx.fillStyle = C.red;
            ctx.font = font(44, 800); spacing(4);
            ctx.fillText('CANTUS INTERRUPTUS', W / 2 + 2, H / 2 + 6);
            spacing(0);

            ctx.fillStyle = C.soft;
            ctx.font = font(14, 600);
            ctx.fillText('Press any key or tap to continue', W / 2, H / 2 + 48);

            if (gameMode === 'ENDLESS' || gameMode === 'GRADUS') {
                ctx.fillStyle = C.ink;
                ctx.font = font(15, 700);
                ctx.fillText(`Spatium Ultimatum: ${endlessDistance}`, W / 2, H / 2 + 80);
            }
        }

        if (gameState === 'NAME_INPUT') {
            drawNameInput();
        } else if (gameState === 'LEADERBOARD') {
            drawLeaderboard();
        } else if (gameState === 'INSTALL_PROMPT') {
            veil(0.98);
            ctx.fillStyle = C.ink;
            ctx.textAlign = 'center';
            ctx.font = font(22, 600);
            ctx.fillText('For optimal playing experience on iPhone,', W / 2, H / 2 - 34);
            ctx.fillText('press the ••• button, press Share ', W / 2, H / 2);
            ctx.fillText('and select "Add to Home Screen".', W / 2, H / 2 + 34);

            ctx.fillStyle = C.mark;
            ctx.font = font(13, 600);
            ctx.fillText('Tap anywhere to return', W / 2, H - 30);
        }
    }

    function loop(now) { 
        if (typeof now !== 'number') now = performance.now();
        let dt = now - lastTime;
        if (dt > 250) dt = 250; 
        lastTime = now;
        accumulator += dt;
        while (accumulator >= FIXED_DT_MS) {
            if (gameState === 'PLAY') levelTime += (FIXED_DT_MS / 1000) * speedSettings[difficultyIndex].mult;
            update();
            accumulator -= FIXED_DT_MS;
        }
        draw();
        requestAnimationFrame(loop); 
    }
    requestAnimationFrame(loop);
</script>
</body>
</html>
