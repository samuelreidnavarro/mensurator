                    ctx.fillRect(sx - bx, sy - 1050 * k, bx * 2, 14 * k); ctx.fillRect(sx - bx, sy - 800 * k, bx * 2, 14 * k);
                    ctx.fillStyle = (T.hand || T.mono) ? C.ink : C.red; ctx.textAlign = 'center';
                    ctx.font = `${Math.max(1, 200 * k)}px ${T.display}`; if (!T.hand) spacing(30 * k);
                    ctx.fillText(T.hand ? 'Finalis' : 'FINALIS', sx, sy - 855 * k); spacing(0);
                } else if (o.kind === 'box') {
                    const sz = 130 * k, by = sy - 80 * k - sz + Math.sin(kart.t * 3 + o.x * 5) * 15 * k;
                    ctx.fillStyle = C.ink; ligHead(ctx, sx - sz / 2, by, sz, sz, false, 0);
                    ctx.fillStyle = C.red; ctx.textAlign = 'center'; ctx.font = `${Math.max(1, sz * 0.8)}px ${T.display}`;
                    ctx.fillText('?', sx, by + sz * 0.78);
                } else if (o.kind === 'flat') { ctx.fillStyle = C.red; ctx.strokeStyle = C.red; printFlat(ctx, sx - 20 * k, sy - 10 * k, k * 5); }
                else if (o.kind === 'sharp') { ctx.fillStyle = C.red; ctx.strokeStyle = C.red; ctx.save(); ctx.translate(sx, sy - 90 * k); ctx.rotate(o.spin); printSharp(ctx, -8 * k * 4.5, 0, k * 4.5); ctx.restore(); }
                else if (o.kind === 'kart') {
                    kartKart(o.r, sx, sy, k / 0.4);
                    if (!o.r.me && k / 0.4 > 0.45) { ctx.fillStyle = C.soft; ctx.textAlign = 'center'; ctx.font = font(11 * Math.min(1.2, k / 0.4 + 0.3), 500, true); ctx.fillText(o.r.name, sx, sy - 100 * k / 0.4); }
                }
                if (clipped) ctx.restore();
            }
        }
        ctx.restore();
        kartHud();
    }

    function kartHud() {
        const p = kart.p, order = kartOrder(), place = order.indexOf(p) + 1;
        if (gameState === 'SPLASH') { kartSplash(); return; }
        ctx.textAlign = 'left';
        ctx.fillStyle = C.mark; ctx.font = font(13, 700, false, 'sc'); spacing(3); ctx.fillText('LOCUS', 26, 42); spacing(0);
        ctx.fillStyle = C.red; ctx.font = font(40, 800, false, 'display'); ctx.fillText(ROMAN[place], 24, 84);
        const pw = ctx.measureText(ROMAN[place]).width;
        ctx.fillStyle = C.ink; ctx.font = font(18, 500, false, 'display'); ctx.fillText('/ VI', 32 + pw, 84);
        ctx.font = font(15, 500, true); ctx.fillText(`Circuitus ${ROMAN[Math.max(1, Math.min(KART.LAPS, p.lap))]} / ${ROMAN[KART.LAPS]}`, 26, 108);

        // item slot
        const bx = W / 2 - 25, by = 18;
        ctx.fillStyle = C.ink; ligHead(ctx, bx, by, 50, 50, false, 0);
        if (p.roll > 0) kartItemGlyph(['allabreve', 'flat', 'sharp', 'tempus', 'ink'][Math.floor(kart.frame / 5) % 5], W / 2, by + 25, 1);
        else if (p.item) kartItemGlyph(p.item, W / 2, by + 25, 1);

        ctx.textAlign = 'right'; ctx.fillStyle = C.ink; ctx.font = font(26, 700, false, 'display');
        ctx.fillText(kartTime(kart.t), W - 24, 52);
        let y = 60;
        if (kart.best) { ctx.fillStyle = C.soft; ctx.font = font(13, 500, true); ctx.fillText('Optimum ' + kartTime(kart.best), W - 24, y + 14); y += 22; }
        if (kart.tempus > 0) y = drawStatusPill('Tempus perfectum', C.ink, y);
        if (p.star > 0) y = drawStatusPill('Color', C.red, y);
        if (p.boost > 0) y = drawStatusPill('Alla breve', C.blue, y);

        ctx.textAlign = 'center';
        if (kart.count > 0 && kart.count <= 3) {
            ctx.fillStyle = C.red; ctx.font = font(84, 800, false, 'display');
            ctx.fillText(ROMAN[Math.ceil(kart.count)], W / 2, 190);
        } else if (kart.count <= 0 && kart.t < 0.9 && !kart.done) {
            ctx.fillStyle = C.ink; ctx.font = font(56, 800, false, 'display'); ctx.fillText('Incipite!', W / 2, 180);
        }
        if (kart.count > 0) { ctx.fillStyle = C.soft; ctx.font = font(13, 500, true); ctx.fillText(isTouchDevice ? 'Hold ▲ as I falls for a fast start' : 'Hold ↑ as I falls for a fast start', W / 2, 220); }
        if (kart.banner > 0) { ctx.fillStyle = C.red; ctx.font = font(30, 700, true, 'display'); ctx.fillText('Circuitus ultimus', W / 2, 150); }
        if (kart.done && gameState !== 'WIN') { ctx.fillStyle = C.red; ctx.font = font(60, 800, false, 'display'); ctx.fillText(place === 1 ? 'Victoria!' : 'Finis', W / 2, 180); }
        if (gameState === 'WIN') kartResults(order);
    }

    function kartSplash() {
        veil(0.95);
        ctx.textAlign = 'center';
        ctx.fillStyle = C.mark; ctx.font = font(13, 700, false, 'sc'); spacing(3); ctx.fillText('CURSUS', W / 2 + 1.5, 92); spacing(0);
        ctx.fillStyle = C.ink; ctx.font = font(42, 800, false, 'display'); ctx.fillText('Circus Maximus', W / 2, 142);
        ctx.fillStyle = C.line; ctx.fillRect(W / 2 - 24, 166, 48, 2);
        ctx.fillStyle = C.inkSoft; ctx.font = font(17, 400, true);
        if (isTouchDevice) { ctx.fillText('◀ ▶ steer   ·   ▲ hop and drift   ·   ▼ brake   ·   ● item', W / 2, 206); ctx.fillText('Hold a drift through a bend, then let go for a burst of speed.', W / 2, 230); }
        else { ctx.fillText('← → steer   ·   ↑ hop and drift   ·   ↓ brake   ·   Space item', W / 2, 206); ctx.fillText('Hold a drift through a bend, then let go for a burst of speed.', W / 2, 230); }
        ctx.fillStyle = C.soft; ctx.font = font(13, 500); ctx.fillText('Three circuits against five rivals', W / 2, 258);
        ctx.fillStyle = C.mark; ctx.font = font(14, 600); ctx.fillText('Press any key or tap to continue', W / 2, H - 40);
    }

    function kartResults(order) {
        veil(0.93);
        ctx.textAlign = 'center';
        const place = order.indexOf(kart.p) + 1;
        ctx.fillStyle = C.mark; ctx.font = font(13, 700, false, 'sc'); spacing(3); ctx.fillText('CURSUS', W / 2 + 1.5, 62); spacing(0);
        ctx.fillStyle = C.ink; ctx.font = font(40, 800, false, 'display'); ctx.fillText(place === 1 ? 'Victoria!' : `Locus ${ROMAN[place]}`, W / 2, 106);
        order.forEach((r, i) => {
            const y = 146 + i * 28;
            ctx.fillStyle = r.me ? C.red : C.ink;
            ctx.font = font(18, r.me ? 700 : 500, false, 'display');
            ctx.textAlign = 'right'; ctx.fillText(ROMAN[i + 1], 300, y);
            ctx.textAlign = 'left'; ctx.fillText(r.name, 324, y);
            ctx.textAlign = 'right'; ctx.font = font(16, 500); ctx.fillText(kartTime(r.finish), 520, y);
        });
        ctx.textAlign = 'center';
        if (kart.best) { ctx.fillStyle = kart.newBest ? C.red : C.soft; ctx.font = font(14, 500, true); ctx.fillText((kart.newBest ? 'New optimum ' : 'Optimum ') + kartTime(kart.best), W / 2, 330); }
        ctx.fillStyle = C.mark; ctx.font = font(14, 600); ctx.fillText('Press any key or tap to continue', W / 2, H - 30);
    }

    function loop(now) { 
        if (typeof now !== 'number') now = performance.now();
        let dt = now - lastTime;
        if (dt > 250) dt = 250; 
        lastTime = now;
        accumulator += dt;
        while (accumulator >= FIXED_DT_MS) {
            if (gameState === 'PLAY') levelTime += (FIXED_DT_MS / 1000) * speedSettings[difficultyIndex].mult;
            update();
            accumulator -= FIXED_DT_MS;
        }
        draw();
        fx.render();
        requestAnimationFrame(loop); 
    }
    let savedTheme = 'rubrica';
    try { savedTheme = localStorage.getItem('mensuratorTheme') || 'rubrica'; } catch (e) {}
    applyTheme(savedTheme);
    if (location.hash === '#install') { gameState = 'INSTALL_PROMPT'; history.replaceState(null, '', location.pathname); }
    requestAnimationFrame(loop);
</script>
</body>
</html>
